<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Plan — editorial v1</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EFEBE7; --ink:#1A1714; --red:#D62219; --muted:#B8B3AD; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { background: var(--paper); font-family: 'Inter Tight', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .slide { width: 1600px; height: 1200px; position: relative; overflow: hidden; background: var(--paper); }
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg .marks { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  .layer { position: absolute; inset: 0; z-index: 2; padding: 58px 80px 0 80px; display: grid; grid-template-rows: auto 1fr auto; row-gap: 16px; }
  .header { display: block; margin-bottom: 2px; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 12px; width: 6px; background: var(--red); }
  .topline { font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--red); margin-bottom: 10px; }
  h1 { font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 96px; line-height: 1.0; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink); }
  h1 .dot { color: var(--red); }
  .scheme { position: relative; display: flex; align-items: center; justify-content: center; }
  .scheme svg { width: 100%; max-width: 1440px; height: auto; }
  .rule { margin: 0 0 78px 0; border: 1.5px solid var(--ink); padding: 22px 28px; display: grid; grid-template-columns: 60px auto 1fr; gap: 28px; align-items: center; background: var(--paper); box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
  .rule .mark { width: 56px; height: 56px; border: 2px solid var(--red); border-radius: 50%; display: grid; place-items: center; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 28px; color: var(--red); }
  .rule .label { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; position: relative; padding-left: 16px; white-space: nowrap; }
  .rule .label::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; background: var(--red); }
  .rule .body { font-size: 17px; line-height: 1.5; }
  .rule .body strong { font-weight: 700; color: var(--red); }
</style>
</head>
<body>
<div class="slide">

  <div class="bg">
    <img class="marks" src="../backgrounds/02_concrete_stairs_red.png" alt="">
  </div>

  <div class="layer">

    <div class="header">
      <div class="title-block">
        <div class="topline">PP.MEDIA · И_И_ · цикл «делай» · PDCA · план</div>
        <h1>Plan<span class="dot">.</span></h1>
      </div>
    </div>

    <div class="scheme">
      <svg viewBox="0 0 1440 580" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ============ СЛОИ ЖАКА (стратиграфия горизонтов) ============ -->
        <text x="0" y="18" font-family="Unbounded" font-weight="700" font-size="11" fill="#D62219" letter-spacing="1.5">СЛОИ ЖАКА · 6 ГОРИЗОНТОВ ПЛАНИРОВАНИЯ</text>

        <g font-family="Inter Tight">
          <!-- слой 1: 20 лет (акцент, верх) -->
          <rect x="0" y="36" width="640" height="74" fill="#1A1714"/>
          <rect x="0" y="36" width="150" height="74" fill="#D62219"/>
          <text x="75" y="80" font-family="JetBrains Mono" font-weight="500" font-size="18" fill="#EFEBE7" text-anchor="middle">20 ЛЕТ</text>
          <text x="172" y="80" font-family="Unbounded" font-weight="800" font-size="16" fill="#EFEBE7">СОВЕТ · СОБСТВЕННИК</text>

          <rect x="0" y="120" width="640" height="74" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.8"/>
          <rect x="0" y="120" width="150" height="74" fill="#1A1714"/>
          <text x="75" y="164" font-family="JetBrains Mono" font-weight="500" font-size="18" fill="#EFEBE7" text-anchor="middle">10 ЛЕТ</text>
          <text x="172" y="164" font-family="Unbounded" font-weight="800" font-size="16" fill="#1A1714">ФУНКЦ. ДИРЕКТОР</text>

          <rect x="0" y="204" width="640" height="74" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.8"/>
          <rect x="0" y="204" width="150" height="74" fill="#1A1714"/>
          <text x="75" y="248" font-family="JetBrains Mono" font-weight="500" font-size="18" fill="#EFEBE7" text-anchor="middle">5 ЛЕТ</text>
          <text x="172" y="248" font-family="Unbounded" font-weight="800" font-size="16" fill="#1A1714">ДИРЕКТОР ПО ПРОДАЖАМ</text>

          <rect x="0" y="288" width="640" height="74" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.8"/>
          <rect x="0" y="288" width="150" height="74" fill="#1A1714"/>
          <text x="75" y="332" font-family="JetBrains Mono" font-weight="500" font-size="18" fill="#EFEBE7" text-anchor="middle">2 ГОДА</text>
          <text x="172" y="332" font-family="Unbounded" font-weight="800" font-size="16" fill="#1A1714">ЗАМ</text>

          <rect x="0" y="372" width="640" height="74" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.8"/>
          <rect x="0" y="372" width="150" height="74" fill="#1A1714"/>
          <text x="75" y="416" font-family="JetBrains Mono" font-weight="500" font-size="18" fill="#EFEBE7" text-anchor="middle">1 ГОД</text>
          <text x="172" y="416" font-family="Unbounded" font-weight="800" font-size="16" fill="#1A1714">ЛИНЕЙНЫЙ РУК-ЛЬ</text>

          <rect x="0" y="456" width="640" height="74" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.8"/>
          <rect x="0" y="456" width="150" height="74" fill="#1A1714"/>
          <text x="75" y="500" font-family="JetBrains Mono" font-weight="500" font-size="18" fill="#EFEBE7" text-anchor="middle">90 ДНЕЙ</text>
          <text x="172" y="500" font-family="Unbounded" font-weight="800" font-size="16" fill="#1A1714">СОТРУДНИК</text>
        </g>

        <text x="0" y="556" font-family="Inter Tight" font-size="15" fill="#6E6963">каждый горизонт превращается в артефакты, доступные машине</text>

        <!-- ============ стрелка → сверка ============ -->
        <g stroke="#1A1714" stroke-width="3" fill="#1A1714">
          <line x1="640" y1="283" x2="744" y2="283"/><polygon points="744,274 762,283 744,292"/>
        </g>

        <!-- ============ МАШИНА СВЕРЯЕТ С ПЛАНОМ ============ -->
        <circle cx="900" cy="283" r="132" fill="#EFEBE7" stroke="#D62219" stroke-width="3.5"/>
        <text x="900" y="268" font-family="Unbounded" font-weight="900" font-size="22" fill="#D62219" text-anchor="middle">МАШИНА</text>
        <text x="900" y="298" font-family="Inter Tight" font-size="16" fill="#1A1714" text-anchor="middle">сверяет с планом</text>
        <text x="900" y="322" font-family="JetBrains Mono" font-size="12" fill="#6E6963" text-anchor="middle">27 документов стратегии</text>

        <!-- стрелка → результат -->
        <g stroke="#1A1714" stroke-width="3" fill="#1A1714">
          <line x1="1032" y1="283" x2="1140" y2="283"/><polygon points="1140,274 1158,283 1140,292"/>
        </g>

        <!-- РЕЗУЛЬТАТ -->
        <rect x="1180" y="213" width="240" height="140" fill="#1A1714"/>
        <text x="1300" y="270" font-family="Unbounded" font-weight="800" font-size="18" fill="#EFEBE7" text-anchor="middle">РЕЗУЛЬТАТ</text>
        <text x="1300" y="300" font-family="Inter Tight" font-size="14" fill="#B8B3AD" text-anchor="middle">воспроизводимый,</text>
        <text x="1300" y="322" font-family="Inter Tight" font-size="14" fill="#B8B3AD" text-anchor="middle">по стратегии</text>

      </svg>
    </div>

    <!-- RULE -->
    <div class="rule">
      <div class="mark">!</div>
      <div class="label">Ловушка</div>
      <div class="body">
        Бесконечные итерации и неоднородный результат —
        <strong>верный признак, что пропущен Plan: машине не дали контекста ни о задаче, ни о стратегии.</strong>
      </div>
    </div>

  </div>

</div>

<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
