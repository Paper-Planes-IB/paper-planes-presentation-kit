<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проходчики — editorial v1</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EFEBE7; --ink:#1A1714; --red:#D62219; --muted:#B8B3AD; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { background: var(--paper); font-family: 'Inter Tight', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .slide { width: 1600px; height: 1200px; position: relative; overflow: hidden; background: var(--paper); }
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg .marks { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  .layer { position: absolute; inset: 0; z-index: 2; padding: 58px 80px 0 80px; display: grid; grid-template-rows: auto 1fr auto; row-gap: 16px; }
  .header { display: block; margin-bottom: 2px; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 12px; width: 6px; background: var(--red); }
  .topline { font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--red); margin-bottom: 10px; }
  h1 { font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 96px; line-height: 1.0; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink); }
  h1 .dot { color: var(--red); }
  .scheme { position: relative; display: flex; align-items: center; justify-content: center; }
  .scheme svg { width: 100%; max-width: 1440px; height: auto; }
  .rule { margin: 0 0 78px 0; border: 1.5px solid var(--ink); padding: 22px 28px; display: grid; grid-template-columns: 60px auto 1fr; gap: 28px; align-items: center; background: var(--paper); box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
  .rule .mark { width: 56px; height: 56px; border: 2px solid var(--red); border-radius: 50%; display: grid; place-items: center; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 32px; color: var(--red); }
  .rule .label { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; position: relative; padding-left: 16px; white-space: nowrap; }
  .rule .label::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; background: var(--red); }
  .rule .body { font-size: 17px; line-height: 1.5; }
  .rule .body strong { font-weight: 700; color: var(--red); }
</style>
</head>
<body>
<div class="slide">

  <div class="bg">
    <img class="marks" src="../backgrounds/05_corner_grids.png" alt="">
  </div>

  <div class="layer">

    <div class="header">
      <div class="title-block">
        <div class="topline">PP.MEDIA · И_И_ · контур «думай» · класс артефактов</div>
        <h1>Проходчики<span class="dot">.</span></h1>
      </div>
    </div>

    <div class="scheme">
      <svg viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ============ ВЕРХ: ОБЩАЯ МЕХАНИКА ============ -->
        <g font-family="Inter Tight">
          <!-- box 1: определение -->
          <rect x="0" y="24" width="380" height="84" fill="#EFEBE7" stroke="#1A1714" stroke-width="2.2"/>
          <text x="190" y="58" font-family="Unbounded" font-weight="800" font-size="14" fill="#D62219" text-anchor="middle" letter-spacing="0.4">КРОН-ОПЕРАТОР В CODEX</text>
          <text x="190" y="84" font-size="13" fill="#1A1714" text-anchor="middle">включается сам, по расписанию</text>

          <!-- arrow -->
          <g stroke="#1A1714" stroke-width="2.2" fill="#1A1714">
            <line x1="380" y1="66" x2="436" y2="66"/><polygon points="436,60 448,66 436,72"/>
          </g>

          <!-- box 2 -->
          <rect x="448" y="24" width="392" height="84" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
          <text x="644" y="58" font-family="Unbounded" font-weight="800" font-size="14" fill="#1A1714" text-anchor="middle" letter-spacing="0.4">ИДЁТ ПО VAULT</text>
          <text x="644" y="84" font-size="13" fill="#1A1714" text-anchor="middle">делает то, что я ему прописал</text>

          <!-- arrow -->
          <g stroke="#1A1714" stroke-width="2.2" fill="#1A1714">
            <line x1="840" y1="66" x2="896" y2="66"/><polygon points="896,60 908,66 896,72"/>
          </g>

          <!-- box 3 -->
          <rect x="908" y="24" width="532" height="84" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
          <text x="1174" y="58" font-family="Unbounded" font-weight="800" font-size="14" fill="#1A1714" text-anchor="middle" letter-spacing="0.4">СВОДКА ОТКЛОНЕНИЙ</text>
          <text x="1174" y="84" font-size="13" fill="#1A1714" text-anchor="middle">отдаёт мне, решение оставляет за мной</text>
        </g>

        <!-- ============ НИЗ: ТРИ ТИПА ============ -->
        <text x="0" y="160" font-family="Unbounded" font-weight="700" font-size="11" fill="#D62219" letter-spacing="1.5">ТРИ ТИПА ПРОХОДЧИКОВ</text>

        <g transform="translate(0,176)" font-family="Inter Tight">

          <!-- 01 АРХЕТИПИЧЕСКИЙ -->
          <g transform="translate(0,0)">
            <rect x="0" y="0" width="460" height="364" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
            <rect x="0" y="0" width="54" height="364" fill="#1A1714"/>
            <text x="27" y="46" font-family="Unbounded" font-weight="900" font-size="20" fill="#EFEBE7" text-anchor="middle">01</text>
            <text x="80" y="52" font-family="Unbounded" font-weight="800" font-size="17" fill="#1A1714">АРХЕТИПИЧЕСКИЙ</text>
            <g font-size="16" fill="#1A1714">
              <text x="80" y="112">Смотрит новый проект и говорит,</text>
              <text x="80" y="142">на какие из прошлых он похож.</text>
              <text x="80" y="172">И какой вопрос задать на встрече,</text>
              <text x="80" y="202">чтобы понять, на какой именно.</text>
            </g>
            <rect x="80" y="296" width="356" height="40" fill="#EFEBE7" stroke="#D62219" stroke-width="1.4"/>
            <text x="258" y="321" font-family="JetBrains Mono" font-size="13" fill="#D62219" text-anchor="middle" letter-spacing="0.5">на что похож проект</text>
          </g>

          <!-- 02 QA-АГЕНТЫ -->
          <g transform="translate(490,0)">
            <rect x="0" y="0" width="460" height="364" fill="#EFEBE7" stroke="#D62219" stroke-width="2.4"/>
            <rect x="0" y="0" width="54" height="364" fill="#D62219"/>
            <text x="27" y="46" font-family="Unbounded" font-weight="900" font-size="20" fill="#EFEBE7" text-anchor="middle">02</text>
            <text x="80" y="52" font-family="Unbounded" font-weight="800" font-size="17" fill="#D62219">QA-АГЕНТЫ</text>
            <g font-size="16" fill="#1A1714">
              <text x="80" y="112">Знает стандарты: на третий день —</text>
              <text x="80" y="142">паспорт проекта, дальше своя</text>
              <text x="80" y="172">проверка. Паспорта нет — не молчит</text>
              <text x="80" y="202">и сам не чинит, спрашивает: «собрать?»</text>
            </g>
            <rect x="80" y="296" width="356" height="40" fill="#EFEBE7" stroke="#D62219" stroke-width="1.4"/>
            <text x="258" y="321" font-family="JetBrains Mono" font-size="13" fill="#D62219" text-anchor="middle" letter-spacing="0.5">всё ли на месте</text>
          </g>

          <!-- 03 КОММУНИКАТОР -->
          <g transform="translate(980,0)">
            <rect x="0" y="0" width="460" height="364" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
            <rect x="0" y="0" width="54" height="364" fill="#1A1714"/>
            <text x="27" y="46" font-family="Unbounded" font-weight="900" font-size="20" fill="#EFEBE7" text-anchor="middle">03</text>
            <text x="80" y="52" font-family="Unbounded" font-weight="800" font-size="17" fill="#1A1714">КОММУНИКАТОР</text>
            <g font-size="16" fill="#1A1714">
              <text x="80" y="112">Готовит коллеге нужные файлы</text>
              <text x="80" y="142">в свежей версии и передаёт.</text>
              <text x="80" y="172">В свой Drive я никого не пускаю,</text>
              <text x="80" y="202">обмен идёт только так, через OAuth.</text>
            </g>
            <rect x="80" y="296" width="356" height="40" fill="#EFEBE7" stroke="#D62219" stroke-width="1.4"/>
            <text x="258" y="321" font-family="JetBrains Mono" font-size="13" fill="#D62219" text-anchor="middle" letter-spacing="0.5">что кому передать</text>
          </g>

        </g>

      </svg>
    </div>

    <!-- RULE: итог -->
    <div class="rule">
      <div class="mark">!</div>
      <div class="label">Зачем</div>
      <div class="body">
        Сами они ничего не сочиняют.
        <strong>Их работа — чтобы в системе был порядок, пока я занят другим: стандарты на месте, ничего не потеряно, каждый проект попал в свой архетип.</strong>
      </div>
    </div>

  </div>

</div>

<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
