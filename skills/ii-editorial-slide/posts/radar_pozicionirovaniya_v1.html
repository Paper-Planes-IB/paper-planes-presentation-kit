<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Радар позиционирования — editorial</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Unbounded:wght@700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F8F5ED; --ink:#1A1714; --red:#E84A38; --muted:#B8B3AD; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { background: var(--paper); font-family: 'Inter Tight', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .slide { width: 1600px; height: 1200px; position: relative; overflow: hidden; background-color: var(--paper); background-image: linear-gradient(rgba(184,179,173,0.22) 1px, transparent 1px), linear-gradient(90deg, rgba(184,179,173,0.22) 1px, transparent 1px); background-size: 46px 46px; }
  .layer { position: absolute; inset: 0; z-index: 2; padding: 58px 80px 56px 80px; display: grid; grid-template-rows: auto 1fr auto; row-gap: 14px; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 12px; width: 6px; background: var(--red); }
  .topline { font-family: 'JetBrains Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--red); margin-bottom: 10px; }
  h1 { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 78px; line-height: 1.0; letter-spacing: -0.01em; text-transform: uppercase; color: var(--ink); }
  h1 .dot { color: var(--red); }
  .scheme { position: relative; display: flex; align-items: center; justify-content: center; }
  .scheme svg { width: 100%; max-width: 1500px; height: auto; }
  .rule { border: 1.5px solid var(--ink); padding: 20px 30px; display: grid; grid-template-columns: 56px auto; gap: 26px; align-items: center; background: var(--paper); }
  .rule .mark { width: 52px; height: 52px; border: 2px solid var(--red); border-radius: 50%; display: grid; place-items: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px; color: var(--red); }
  .rule .body { font-size: 21px; line-height: 1.4; }
  .rule .body strong { font-weight: 700; color: var(--red); }
</style>
</head>
<body>
<div class="slide">
  <div class="layer">

    <div class="title-block">
      <div class="topline">ILYA BALAHNIN · радар позиционирования промышленного поставщика</div>
      <h1>Шесть типов<br>ценности<span class="dot">.</span></h1>
    </div>

    <div class="scheme">
      <svg viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="700.0,350.0 743.3,375.0 743.3,425.0 700.0,450.0 656.7,425.0 656.7,375.0" fill="none" stroke="#C9C3BB" stroke-width="1.0" opacity="0.55"/>
        <polygon points="700.0,300.0 786.6,350.0 786.6,450.0 700.0,500.0 613.4,450.0 613.4,350.0" fill="none" stroke="#C9C3BB" stroke-width="1.0" opacity="0.55"/>
        <polygon points="700.0,250.0 829.9,325.0 829.9,475.0 700.0,550.0 570.1,475.0 570.1,325.0" fill="none" stroke="#C9C3BB" stroke-width="1.0" opacity="0.55"/>
        <polygon points="700.0,200.0 873.2,300.0 873.2,500.0 700.0,600.0 526.8,500.0 526.8,300.0" fill="none" stroke="#C9C3BB" stroke-width="1.0" opacity="0.55"/>
        <polygon points="700.0,150.0 916.5,275.0 916.5,525.0 700.0,650.0 483.5,525.0 483.5,275.0" fill="none" stroke="#C9C3BB" stroke-width="2.0" opacity="1.0"/>
        <line x1="700" y1="400" x2="700.0" y2="150.0" stroke="#C9C3BB" stroke-width="1"/>
        <line x1="700" y1="400" x2="916.5" y2="275.0" stroke="#C9C3BB" stroke-width="1"/>
        <line x1="700" y1="400" x2="916.5" y2="525.0" stroke="#C9C3BB" stroke-width="1"/>
        <line x1="700" y1="400" x2="700.0" y2="650.0" stroke="#C9C3BB" stroke-width="1"/>
        <line x1="700" y1="400" x2="483.5" y2="525.0" stroke="#C9C3BB" stroke-width="1"/>
        <line x1="700" y1="400" x2="483.5" y2="275.0" stroke="#C9C3BB" stroke-width="1"/>
        <text x="710.0" y="355.0" font-family="JetBrains Mono" font-size="15" fill="#B0AAA2">1</text>
        <text x="710.0" y="305.0" font-family="JetBrains Mono" font-size="15" fill="#B0AAA2">2</text>
        <text x="710.0" y="255.0" font-family="JetBrains Mono" font-size="15" fill="#B0AAA2">3</text>
        <text x="710.0" y="205.0" font-family="JetBrains Mono" font-size="15" fill="#B0AAA2">4</text>
        <text x="710.0" y="155.0" font-family="JetBrains Mono" font-size="15" fill="#B0AAA2">5</text>
        <text x="700" y="90" font-family="Oswald" font-weight="700" font-size="23" fill="#1A1714" text-anchor="middle">Управление рисками</text><text x="700" y="112" font-family="JetBrains Mono" font-size="14" fill="#9A958E" text-anchor="middle">сроки · простои · отказы</text>
        <text x="946" y="254" font-family="Oswald" font-weight="700" font-size="23" fill="#1A1714" text-anchor="start">Операционная эффективность</text><text x="946" y="278" font-family="JetBrains Mono" font-size="14" fill="#9A958E" text-anchor="start">OEE · доступность · качество</text>
        <text x="946" y="538" font-family="Oswald" font-weight="700" font-size="23" fill="#1A1714" text-anchor="start">Проектная управляемость</text><text x="946" y="562" font-family="JetBrains Mono" font-size="14" fill="#9A958E" text-anchor="start">стыки · ПНР · график</text>
        <text x="700" y="702" font-family="Oswald" font-weight="700" font-size="23" fill="#1A1714" text-anchor="middle">Экономика владения</text><text x="700" y="726" font-family="JetBrains Mono" font-size="14" fill="#9A958E" text-anchor="middle">TCO · ресурс · сервис</text>
        <text x="454" y="538" font-family="Oswald" font-weight="700" font-size="23" fill="#1A1714" text-anchor="end">Цифровой контур</text><text x="454" y="562" font-family="JetBrains Mono" font-size="14" fill="#9A958E" text-anchor="end">данные · АСУ ТП · аналитика</text>
        <text x="454" y="254" font-family="Oswald" font-weight="700" font-size="23" fill="#1A1714" text-anchor="end">Комплаенс и регуляторика</text><text x="454" y="278" font-family="JetBrains Mono" font-size="14" fill="#9A958E" text-anchor="end">сертификация · приёмка</text>

        <!-- типичный поставщик: размытый ровный блоб -->
        <polygon points="700.0,300.0 786.6,350.0 829.9,475.0 700.0,500.0 656.7,425.0 613.4,350.0" fill="#9A958E" fill-opacity="0.10" stroke="#9A958E" stroke-width="2" stroke-dasharray="5 5"/>
        <!-- доказуемая территория: пик на управлении рисками -->
        <polygon points="700.0,150.0 873.2,300.0 873.2,500.0 700.0,550.0 570.1,475.0 526.8,300.0" fill="#E84A38" fill-opacity="0.14" stroke="#E84A38" stroke-width="3"/>
        <circle cx="700.0" cy="150.0" r="6.5" fill="#E84A38"/><circle cx="873.2" cy="300.0" r="6.5" fill="#E84A38"/><circle cx="873.2" cy="500.0" r="6.5" fill="#E84A38"/><circle cx="700.0" cy="550.0" r="6.5" fill="#E84A38"/><circle cx="570.1" cy="475.0" r="6.5" fill="#E84A38"/><circle cx="526.8" cy="300.0" r="6.5" fill="#E84A38"/>

        <!-- легенда -->
        <g font-family="Inter Tight" font-size="18" fill="#1A1714">
          <line x1="1120" y1="40" x2="1166" y2="40" stroke="#E84A38" stroke-width="3"/>
          <circle cx="1143" cy="40" r="5" fill="#E84A38"/>
          <text x="1178" y="46">доказуемая территория</text>
          <line x1="1120" y1="74" x2="1166" y2="74" stroke="#9A958E" stroke-width="2" stroke-dasharray="5 5"/>
          <text x="1178" y="80" fill="#6E6962">типичный поставщик</text>
        </g>
        <text x="1120" y="118" font-family="JetBrains Mono" font-size="13" fill="#9A958E">шкала 1 базовый … 5 ведущий</text>
      </svg>
    </div>

    <div class="rule">
      <div class="mark">!</div>
      <div class="body">«Полный цикл» и «надёжность» звучат у всех одинаково. <strong>Сильная позиция — это одна доказуемая территория, по которой вас узнают на рынке.</strong></div>
    </div>

  </div>
</div>
<script>document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });</script>
</body>
</html>
