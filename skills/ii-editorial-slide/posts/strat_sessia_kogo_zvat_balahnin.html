<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кого звать на стратсессию — balahnin</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F8F5ED; --ink:#1A1714; --red:#E84A38; --muted:#B8B3AD; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { background: var(--paper); font-family: 'Inter Tight', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .slide { width: 1600px; height: 1200px; position: relative; overflow: hidden; background-color: var(--paper); background-image: linear-gradient(rgba(184,179,173,0.22) 1px, transparent 1px), linear-gradient(90deg, rgba(184,179,173,0.22) 1px, transparent 1px); background-size: 46px 46px; }
  .layer { position: absolute; inset: 0; z-index: 2; padding: 58px 80px 56px 80px; display: grid; grid-template-rows: auto 1fr auto; row-gap: 22px; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 12px; width: 6px; background: var(--red); }
  .topline { font-family: 'JetBrains Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--red); margin-bottom: 10px; }
  h1 { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 82px; line-height: 1.02; letter-spacing: -0.01em; text-transform: uppercase; color: var(--ink); }
  h1 .dot { color: var(--red); }
  .scheme { position: relative; display: flex; align-items: center; justify-content: center; }
  .scheme svg { width: 100%; max-width: 1560px; height: auto; }
  .rule { border: 1.5px solid var(--ink); padding: 22px 30px; display: grid; grid-template-columns: 60px auto; gap: 26px; align-items: center; background: var(--paper); }
  .rule .mark { width: 54px; height: 54px; border: 2px solid var(--red); border-radius: 50%; display: grid; place-items: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px; color: var(--red); }
  .rule .body { font-size: 21px; line-height: 1.4; }
  .rule .body strong { font-weight: 700; color: var(--red); }
</style>
</head>
<body>
<div class="slide">
  <div class="layer">

    <div class="title-block">
      <div class="topline">ILYA BALAHNIN · стратегическая сессия</div>
      <h1>Кого звать на<br>стратсессию<span class="dot">.</span></h1>
    </div>

    <div class="scheme">
      <svg viewBox="0 0 1440 700" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ЛЕВО: кто выбирает направление -->
        <text x="20" y="30" font-family="Oswald" font-weight="700" font-size="22" fill="#9A958E" letter-spacing="1">ЛЕГКО СОБРАТЬ · ВЫБИРАЮТ НАПРАВЛЕНИЕ</text>

        <rect x="40" y="64" width="250" height="64" fill="#F8F5ED" stroke="#1A1714" stroke-width="2.4"/>
        <text x="165" y="104" font-family="Oswald" font-weight="600" font-size="26" fill="#1A1714" text-anchor="middle">СОБСТВЕННИК</text>
        <rect x="310" y="64" width="290" height="64" fill="#F8F5ED" stroke="#1A1714" stroke-width="2.4"/>
        <text x="455" y="104" font-family="Oswald" font-weight="600" font-size="26" fill="#1A1714" text-anchor="middle">ТОП-КОМАНДА</text>

        <line x1="320" y1="128" x2="320" y2="178" stroke="#1A1714" stroke-width="2.6"/>
        <polygon points="320,188 309,170 331,170" fill="#1A1714"/>

        <rect x="40" y="198" width="560" height="120" fill="none" stroke="#9A958E" stroke-width="2.2"/>
        <text x="64" y="240" font-family="Oswald" font-weight="700" font-size="24" fill="#1A1714">РЕШЕНИЕ: новое B2B-направление</text>
        <text x="64" y="278" font-family="Inter Tight" font-size="22" fill="#1A1714">сегмент, предложение, первые клиенты,</text>
        <text x="64" y="306" font-family="Inter Tight" font-size="22" fill="#1A1714">пилот на квартал</text>

        <rect x="40" y="360" width="560" height="120" fill="none" stroke="#E84A38" stroke-width="2.4" stroke-dasharray="5 6"/>
        <text x="64" y="402" font-family="Oswald" font-weight="700" font-size="22" fill="#E84A38">НЕ СОБРАЛИ УСЛОВИЯ ИСПОЛНЕНИЯ</text>
        <text x="64" y="440" font-family="Inter Tight" font-size="22" fill="#1A1714">что обещаем клиенту и какие старые</text>
        <text x="64" y="468" font-family="Inter Tight" font-size="22" fill="#1A1714">правила проверить до первого пилота</text>

        <!-- мост -->
        <line x1="600" y1="258" x2="740" y2="258" stroke="#E84A38" stroke-width="2.6"/>
        <polygon points="752,258 732,247 732,269" fill="#E84A38"/>

        <!-- разделитель -->
        <line x1="700" y1="20" x2="700" y2="660" stroke="#1A1714" stroke-width="1.4" stroke-dasharray="5 6"/>

        <!-- ПРАВО: кто переводит в работу -->
        <text x="752" y="30" font-family="Oswald" font-weight="700" font-size="22" fill="#E84A38" letter-spacing="1">СЛОЖНЕЕ ПОЗВАТЬ · ПЕРЕВОДЯТ В РАБОТУ</text>

        <g font-family="Inter Tight">
          <rect x="752" y="64" width="668" height="128" fill="#F8F5ED" stroke="#1A1714" stroke-width="1.8"/>
          <rect x="752" y="64" width="9" height="128" fill="#E84A38"/>
          <text x="784" y="108" font-family="Oswald" font-weight="700" font-size="28" fill="#1A1714">ЮРИСТ</text>
          <text x="784" y="146" font-size="22" fill="#1A1714">какую ответственность компания готова взять</text>
          <text x="784" y="176" font-size="22" fill="#1A1714">и где граница обещания клиенту</text>

          <rect x="752" y="208" width="668" height="128" fill="#F8F5ED" stroke="#1A1714" stroke-width="1.8"/>
          <rect x="752" y="208" width="9" height="128" fill="#E84A38"/>
          <text x="784" y="252" font-family="Oswald" font-weight="700" font-size="28" fill="#1A1714">ФИНАНСОВЫЙ ДИРЕКТОР</text>
          <text x="784" y="290" font-size="22" fill="#1A1714">что признавать выручкой, какие затраты</text>
          <text x="784" y="320" font-size="22" fill="#1A1714">на исполнение, какой документ закрывает этап</text>

          <rect x="752" y="352" width="668" height="92" fill="#F8F5ED" stroke="#1A1714" stroke-width="1.8"/>
          <rect x="752" y="352" width="9" height="92" fill="#E84A38"/>
          <text x="784" y="392" font-family="Oswald" font-weight="700" font-size="28" fill="#1A1714">ЗАКУПКИ</text>
          <text x="784" y="426" font-size="22" fill="#1A1714">кто и по какому критерию меняет поставщика</text>

          <rect x="752" y="460" width="668" height="128" fill="#F8F5ED" stroke="#E84A38" stroke-width="2.4"/>
          <rect x="752" y="460" width="9" height="128" fill="#E84A38"/>
          <text x="784" y="504" font-family="Oswald" font-weight="700" font-size="28" fill="#E84A38">ВЛАДЕЛЕЦ РЕЗУЛЬТАТА</text>
          <text x="784" y="542" font-size="22" fill="#1A1714">права: менять срок, просить замену, видеть</text>
          <text x="784" y="572" font-size="22" fill="#1A1714">статус и фиксировать документ-подтверждение</text>
        </g>

      </svg>
    </div>

    <div class="rule">
      <div class="mark">!</div>
      <div class="body">Не позвать этих людей — и решение уходит с сессии как стратегия, а через неделю возвращается как набор срочных согласований: <strong>договор, оплата, поставщик, данные, роль.</strong></div>
    </div>

  </div>
</div>
<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
