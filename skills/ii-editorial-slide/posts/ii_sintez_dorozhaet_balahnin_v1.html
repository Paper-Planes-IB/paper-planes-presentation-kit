<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Синтетическое мышление дорожает — editorial</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Unbounded:wght@700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F8F5ED; --ink:#1A1714; --red:#E84A38; --muted:#B8B3AD; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { background: var(--paper); font-family: 'Inter Tight', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .slide { width: 1600px; height: 1200px; position: relative; overflow: hidden; background-color: var(--paper); background-image: linear-gradient(rgba(184,179,173,0.22) 1px, transparent 1px), linear-gradient(90deg, rgba(184,179,173,0.22) 1px, transparent 1px); background-size: 46px 46px; }
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg .marks { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; opacity: 0.85; }
  .layer { position: absolute; inset: 0; z-index: 2; padding: 58px 80px 60px 80px; display: grid; grid-template-rows: auto 1fr; row-gap: 18px; }
  .header { display: block; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 12px; width: 6px; background: var(--red); }
  .topline { font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--red); margin-bottom: 10px; }
  h1 { font-family: 'Oswald', sans-serif; font-weight: 900; font-size: 84px; line-height: 1.02; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink); }
  h1 .dot { color: var(--red); }
  .scheme { position: relative; display: flex; align-items: center; justify-content: center; }
  .scheme svg { width: 100%; max-width: 1560px; height: auto; }
  .rule { border: 1.5px solid var(--ink); padding: 22px 30px; display: grid; grid-template-columns: 60px auto; gap: 26px; align-items: center; background: var(--paper); }
  .rule .mark { width: 54px; height: 54px; border: 2px solid var(--red); border-radius: 50%; display: grid; place-items: center; font-family: 'Oswald', sans-serif; font-weight: 800; font-size: 24px; color: var(--red); }
  .rule .body { font-size: 19px; line-height: 1.45; }
  .rule .body strong { font-weight: 700; color: var(--red); }
</style>
</head>
<body>
<div class="slide">

  <div class="layer">

    <div class="header">
      <div class="title-block">
        <div class="topline">ILYA BALAHNIN · сдвиг компетенций</div>
        <h1>Синтетическое<br>мышление дорожает<span class="dot">.</span></h1>
      </div>
    </div>

    <div class="scheme">
      <svg viewBox="0 0 1440 740" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ЛЕВО: ВЕК МАШИН — анализ дробит целое на части -->
        <text x="20" y="30" font-family="Oswald" font-weight="700" font-size="22" fill="#9A958E" letter-spacing="1">ВЕК МАШИН · АНАЛИЗ</text>
        <text x="20" y="72" font-family="Inter Tight" font-size="24" fill="#1A1714" font-weight="500">Чтобы понять целое, его дробят на части</text>

        <rect x="90" y="120" width="420" height="100" fill="#F8F5ED" stroke="#1A1714" stroke-width="2.4"/>
        <text x="300" y="183" font-family="Oswald" font-weight="700" font-size="32" fill="#1A1714" text-anchor="middle">ЗАДАЧА ЦЕЛИКОМ</text>

        <line x1="300" y1="220" x2="300" y2="300" stroke="#1A1714" stroke-width="2.6"/>
        <polygon points="300,310 289,292 311,292" fill="#1A1714"/>

        <g>
          <rect x="40" y="330" width="118" height="74" fill="#F8F5ED" stroke="#9A958E" stroke-width="2.2"/>
          <rect x="178" y="330" width="118" height="74" fill="#F8F5ED" stroke="#9A958E" stroke-width="2.2"/>
          <rect x="316" y="330" width="118" height="74" fill="#9A958E" stroke="#9A958E" stroke-width="2.2"/>
          <rect x="454" y="330" width="118" height="74" fill="#F8F5ED" stroke="#9A958E" stroke-width="2.2"/>
          <rect x="110" y="424" width="118" height="74" fill="#F8F5ED" stroke="#9A958E" stroke-width="2.2"/>
          <rect x="248" y="424" width="118" height="74" fill="#F8F5ED" stroke="#9A958E" stroke-width="2.2"/>
          <rect x="386" y="424" width="118" height="74" fill="#F8F5ED" stroke="#9A958E" stroke-width="2.2"/>
        </g>
        <text x="306" y="540" font-family="JetBrains Mono" font-size="19" fill="#9A958E" text-anchor="middle">элементарные операции</text>

        <rect x="40" y="582" width="540" height="130" fill="none" stroke="#E84A38" stroke-width="2.4" stroke-dasharray="5 6"/>
        <text x="68" y="626" font-family="Oswald" font-weight="700" font-size="22" fill="#E84A38">ИИ забирает эти операции</text>
        <text x="68" y="664" font-family="Inter Tight" font-size="22" fill="#1A1714">собрать данные, разложить на факторы,</text>
        <text x="68" y="694" font-family="Inter Tight" font-size="22" fill="#1A1714">посчитать, свести, сверить</text>

        <!-- разделитель -->
        <line x1="720" y1="20" x2="720" y2="712" stroke="#1A1714" stroke-width="1.4" stroke-dasharray="5 6"/>

        <!-- ПРАВО: ВЕК СИСТЕМ — синтез собирает части в целое -->
        <text x="770" y="30" font-family="Oswald" font-weight="700" font-size="22" fill="#E84A38" letter-spacing="1">ВЕК СИСТЕМ · СИНТЕЗ</text>
        <text x="770" y="72" font-family="Inter Tight" font-size="24" fill="#1A1714" font-weight="500">Из частей собирают работающее целое</text>

        <!-- собранная система вверху -->
        <g>
          <line x1="980" y1="200" x2="1110" y2="168" stroke="#E84A38" stroke-width="3"/>
          <line x1="1110" y1="168" x2="1210" y2="250" stroke="#E84A38" stroke-width="3"/>
          <line x1="1210" y1="250" x2="1050" y2="296" stroke="#E84A38" stroke-width="3"/>
          <line x1="1050" y1="296" x2="980" y2="200" stroke="#E84A38" stroke-width="3"/>
          <line x1="980" y1="200" x2="1210" y2="250" stroke="#E84A38" stroke-width="3"/>
          <circle cx="980" cy="200" r="18" fill="#E84A38"/>
          <circle cx="1110" cy="168" r="18" fill="#E84A38"/>
          <circle cx="1210" cy="250" r="18" fill="#E84A38"/>
          <circle cx="1050" cy="296" r="18" fill="#E84A38"/>
        </g>
        <text x="1095" y="128" font-family="Oswald" font-weight="700" font-size="30" fill="#1A1714" text-anchor="middle">СИСТЕМА</text>

        <!-- стрелки сборки снизу вверх -->
        <g stroke="#E84A38" stroke-width="2.4" fill="none" opacity="0.85">
          <path d="M850 560 C 920 440, 1000 380, 1050 318"/>
          <path d="M1090 560 C 1070 460, 1060 380, 1052 318"/>
          <path d="M1290 520 C 1200 420, 1110 360, 1058 318"/>
          <path d="M970 600 C 1010 480, 1030 380, 1048 320"/>
        </g>

        <!-- разрозненные узлы внизу -->
        <g fill="#9A958E">
          <circle cx="846" cy="568" r="15"/>
          <circle cx="966" cy="608" r="15"/>
          <circle cx="1094" cy="568" r="15"/>
          <circle cx="1294" cy="528" r="15"/>
          <circle cx="1180" cy="612" r="15"/>
        </g>
        <text x="1070" y="690" font-family="JetBrains Mono" font-size="19" fill="#9A958E" text-anchor="middle">разрозненные части</text>

      </svg>
    </div>
    </div>

  </div>

</div>

<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
