<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Машина должна уметь ошибаться правильно — editorial v3</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEBE7;
    --ink: #1A1714;
    --red: #D62219;
    --muted: #B8B3AD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--paper);
    font-family: 'Inter Tight', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .slide {
    width: 1600px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: var(--paper);
  }

  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg .marks {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill;
  }

  .layer {
    position: absolute; inset: 0;
    z-index: 2;
    padding: 72px 80px 0 80px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    row-gap: 28px;
  }

  .header { display: block; margin-bottom: 8px; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before {
    content: "";
    position: absolute; left: 0; top: 16px; bottom: 28px;
    width: 6px; background: var(--red);
  }
  .topline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--red);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 78px;
    line-height: 0.94;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    color: var(--ink);
    white-space: nowrap;
  }
  h1 .dot { color: var(--red); }

  .scheme {
    position: relative; margin: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .scheme svg { width: 100%; max-width: 1440px; height: auto; }

  .rule {
    margin: 0 0 110px 0;
    border: 1.5px solid var(--ink);
    padding: 28px 32px;
    display: grid;
    grid-template-columns: 60px auto 1fr;
    gap: 28px;
    align-items: center;
    background: var(--paper);
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }
  .rule .mark {
    width: 56px; height: 56px;
    border: 2px solid var(--red); border-radius: 50%;
    display: grid; place-items: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 800; font-size: 32px; color: var(--red);
  }
  .rule .label {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.5px;
    position: relative; padding-left: 16px;
    white-space: nowrap;
  }
  .rule .label::before {
    content: ""; position: absolute;
    left: 0; top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; background: var(--red);
  }
  .rule .body { font-size: 17px; line-height: 1.55; }
  .rule .body strong {
    font-weight: 700; color: var(--red);
    text-transform: uppercase; letter-spacing: 0.5px;
    font-family: 'Unbounded', sans-serif; font-size: 14px;
  }
</style>
</head>
<body>
<div class="slide">

  <div class="bg">
    <img class="marks" src="../backgrounds/10_radar_red.png" alt="">
  </div>

  <div class="layer">

    <div class="header">
      <div class="title-block">
        <div class="topline">PP.MEDIA · И_И_ · выпуск 13</div>
        <h1>Машина должна уметь<br>ошибаться правильно<span class="dot">.</span></h1>
      </div>
    </div>

    <!-- СХЕМА: маршрут с точкой отказа → 4 шага восстановления → возврат правила -->
    <div class="scheme">
      <svg viewBox="0 0 1440 740" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ===== 0. ВОЗВРАТНАЯ ПЕТЛЯ (нарисована ПЕРВОЙ, чтобы карточки шагов лежали поверх) ===== -->
        <g>
          <path d="M1270 260 C 1370 260, 1390 600, 720 620 C 130 640, 110 600, 110 130" stroke="#1A1714" stroke-width="1.8" stroke-dasharray="6 5" fill="none"/>
          <polygon points="104,130 110,114 116,130" fill="#1A1714"/>
        </g>

        <!-- ===== 1. ВЕРХНЯЯ ПОЛОСА: ИСХОДНЫЙ МАРШРУТ ===== -->
        <g font-family="Inter Tight" fill="#1A1714">
          <text x="20" y="-2" font-family="Unbounded" font-weight="700" font-size="11" fill="#D62219" letter-spacing="1.5">ИСХОДНЫЙ МАРШРУТ</text>
        </g>

        <!-- Узел 1: Codex -->
        <g transform="translate(20, 20)">
          <rect x="0" y="0" width="220" height="76" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.8"/>
          <rect x="0" y="0" width="220" height="22" fill="#1A1714"/>
          <text x="110" y="16" font-family="Unbounded" font-weight="800" font-size="12" fill="#EFEBE7" text-anchor="middle" letter-spacing="2">CODEX</text>
          <text x="110" y="46" font-family="Inter Tight" font-size="13" font-weight="500" text-anchor="middle">утренняя сборка</text>
          <text x="110" y="64" font-family="Inter Tight" font-size="11" fill="#6E6963" text-anchor="middle">данные подготовлены</text>
        </g>

        <!-- Стрелка → -->
        <g transform="translate(250, 58)">
          <line x1="0" y1="0" x2="60" y2="0" stroke="#1A1714" stroke-width="1.8"/>
          <polygon points="60,-5 72,0 60,5" fill="#1A1714"/>
        </g>

        <!-- Узел 2: обратная запись -->
        <g transform="translate(330, 20)">
          <rect x="0" y="0" width="240" height="76" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.8"/>
          <text x="120" y="28" font-family="Unbounded" font-weight="700" font-size="11" fill="#1A1714" text-anchor="middle" letter-spacing="1">ОБРАТНАЯ ЗАПИСЬ</text>
          <text x="120" y="52" font-family="Inter Tight" font-size="12" font-weight="500" text-anchor="middle">последний шаг маршрута</text>
        </g>

        <!-- ТОЧКА ОТКАЗА -->
        <g transform="translate(584, 58)">
          <circle cx="0" cy="0" r="22" fill="#EFEBE7" stroke="#D62219" stroke-width="2.5"/>
          <circle cx="0" cy="0" r="36" fill="none" stroke="#D62219" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
          <line x1="-10" y1="-10" x2="10" y2="10" stroke="#D62219" stroke-width="3" stroke-linecap="round"/>
          <line x1="10" y1="-10" x2="-10" y2="10" stroke="#D62219" stroke-width="3" stroke-linecap="round"/>
          <text x="0" y="-44" font-family="Unbounded" font-weight="800" font-size="10" fill="#D62219" text-anchor="middle" letter-spacing="1.5">ТОЧКА ОТКАЗА</text>
        </g>

        <!-- Стрелка к базе (оборвалась на точке отказа — показываем как обрыв) -->
        <g transform="translate(620, 58)">
          <line x1="0" y1="0" x2="40" y2="0" stroke="#1A1714" stroke-width="1.8"/>
          <polygon points="40,-5 52,0 40,5" fill="#1A1714"/>
        </g>

        <!-- Узел 3: база задач -->
        <g transform="translate(692, 20)">
          <rect x="0" y="0" width="240" height="76" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.8"/>
          <text x="120" y="20" font-family="Unbounded" font-weight="700" font-size="11" fill="#1A1714" text-anchor="middle" letter-spacing="1">БАЗА ЗАДАЧ</text>
          <text x="120" y="44" font-family="Inter Tight" font-size="12" fill="#1A1714" text-anchor="middle">конечная точка маршрута</text>
          <text x="120" y="62" font-family="Inter Tight" font-size="11" fill="#D62219" text-anchor="middle" font-weight="600">таблица пустая</text>
        </g>

        <!-- ===== ТЕЗИС ЧЕЛОВЕКА ===== -->
        <g transform="translate(990, 30)">
          <rect x="0" y="0" width="380" height="64" fill="#EFEBE7" stroke="#D62219" stroke-width="2"/>
          <text x="18" y="20" font-family="Unbounded" font-weight="700" font-size="11" fill="#D62219" letter-spacing="1">ТЕЗИС ЧЕЛОВЕКА</text>
          <text x="18" y="42" font-family="Inter Tight" font-size="14" font-weight="600" fill="#1A1714">«вот тут пусто, проверь»</text>
          <text x="18" y="58" font-family="Inter Tight" font-size="11" fill="#6E6963">HITL-гейт открыт</text>
        </g>

        <!-- ===== ЛИНИЯ-ВОЗВРАТ: маршрут идёт обратно ===== -->
        <g>
          <path d="M1180 100 C 1180 140, 1100 160, 600 170" stroke="#D62219" stroke-width="2" fill="none"/>
          <polygon points="606,164 590,170 606,176" fill="#D62219"/>
          <text x="900" y="148" font-family="Unbounded" font-weight="700" font-size="11" fill="#D62219" text-anchor="middle" letter-spacing="1.5">МАРШРУТ ОБРАТНО</text>
        </g>

        <!-- ===== 4 ШАГА ВОССТАНОВЛЕНИЯ (увеличенные) ===== -->

        <!-- 01 Self-audit -->
        <g transform="translate(20, 260)">
          <rect x="0" y="0" width="340" height="220" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect x="0" y="0" width="60" height="220" fill="#1A1714"/>
          <text x="30" y="118" font-family="Unbounded" font-weight="900" font-size="32" fill="#EFEBE7" text-anchor="middle">01</text>

          <text x="76" y="32" font-family="Unbounded" font-weight="800" font-size="18" fill="#1A1714" letter-spacing="0.5">САМОПРОВЕРКА</text>
          <text x="76" y="54" font-family="Inter Tight" font-size="13" fill="#6E6963">прохождение маршрута заново</text>

          <g font-family="Inter Tight" font-size="14" fill="#1A1714" transform="translate(76, 78)">
            <rect x="0" y="0" width="4" height="4" fill="#D62219"/>
            <text x="12" y="7">зашёл в базу</text>
            <rect x="0" y="22" width="4" height="4" fill="#D62219"/>
            <text x="12" y="29">прошёл по последним запускам</text>
            <rect x="0" y="44" width="4" height="4" fill="#D62219"/>
            <text x="12" y="51" font-weight="600">локализовал причину отказа</text>
            <rect x="0" y="66" width="4" height="4" fill="#D62219"/>
            <text x="12" y="73">запись оборвалась на последнем шаге</text>
            <rect x="0" y="88" width="4" height="4" fill="#D62219"/>
            <text x="12" y="95">данные подготовлены, в базу не ушли</text>
          </g>

        </g>

        <!-- 02 Task bridge -->
        <g transform="translate(380, 260)">
          <rect x="0" y="0" width="340" height="220" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect x="0" y="0" width="60" height="220" fill="#1A1714"/>
          <text x="30" y="118" font-family="Unbounded" font-weight="900" font-size="32" fill="#EFEBE7" text-anchor="middle">02</text>

          <text x="76" y="32" font-family="Unbounded" font-weight="800" font-size="18" fill="#1A1714" letter-spacing="0.5">ОБХОДНОЙ ПУТЬ</text>
          <text x="76" y="54" font-family="Inter Tight" font-size="13" fill="#6E6963">ручная починка + фиксация инцидента</text>

          <g font-family="Inter Tight" font-size="14" fill="#1A1714" transform="translate(76, 90)">
            <rect x="0" y="0" width="4" height="4" fill="#D62219"/>
            <text x="12" y="7" font-weight="600">починил ошибку ручно</text>
            <rect x="0" y="32" width="4" height="4" fill="#D62219"/>
            <text x="12" y="39" font-weight="600">отметил инцидент в журнале</text>
          </g>

        </g>

        <!-- 03 Проверка источника правды -->
        <g transform="translate(740, 260)">
          <rect x="0" y="0" width="340" height="220" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect x="0" y="0" width="60" height="220" fill="#1A1714"/>
          <text x="30" y="118" font-family="Unbounded" font-weight="900" font-size="32" fill="#EFEBE7" text-anchor="middle">03</text>

          <text x="76" y="32" font-family="Unbounded" font-weight="800" font-size="18" fill="#1A1714" letter-spacing="0.5">ИСТОЧНИК ПРАВДЫ</text>
          <text x="76" y="54" font-family="Inter Tight" font-size="13" fill="#6E6963">single source of truth</text>

          <g font-family="Inter Tight" font-size="14" fill="#1A1714" transform="translate(76, 78)">
            <rect x="0" y="0" width="4" height="4" fill="#D62219"/>
            <text x="12" y="7">прошёл по диску</text>
            <rect x="0" y="22" width="4" height="4" fill="#D62219"/>
            <text x="12" y="29" font-weight="600">исходные данные на месте</text>
            <rect x="0" y="44" width="4" height="4" fill="#D62219"/>
            <text x="12" y="51">сбой ограничился слоем</text>
            <rect x="0" y="66" width="4" height="4" fill="#D62219"/>
            <text x="12" y="73">обратной записи</text>
          </g>

        </g>

        <!-- 04 Обновление локального канона -->
        <g transform="translate(1100, 260)">
          <rect x="0" y="0" width="340" height="220" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect x="0" y="0" width="60" height="220" fill="#1A1714"/>
          <text x="30" y="118" font-family="Unbounded" font-weight="900" font-size="32" fill="#EFEBE7" text-anchor="middle">04</text>

          <text x="76" y="32" font-family="Unbounded" font-weight="800" font-size="18" fill="#1A1714" letter-spacing="0.5">ЛОКАЛЬНЫЙ КАНОН</text>
          <text x="76" y="54" font-family="Inter Tight" font-size="13" fill="#6E6963">правило в файл Codex</text>

          <g font-family="Inter Tight" font-size="14" fill="#1A1714" transform="translate(76, 78)">
            <rect x="0" y="0" width="4" height="4" fill="#D62219"/>
            <text x="12" y="7">проверить доступ</text>
            <rect x="0" y="22" width="4" height="4" fill="#D62219"/>
            <text x="12" y="29">дописать через входящий буфер</text>
            <rect x="0" y="44" width="4" height="4" fill="#D62219"/>
            <text x="12" y="51">отметить инцидент в журнале</text>
            <rect x="0" y="66" width="4" height="4" fill="#D62219"/>
            <text x="12" y="73">обновить статусы</text>
            <rect x="0" y="88" width="4" height="4" fill="#D62219"/>
            <text x="12" y="95" font-weight="600">файл, который Codex читает на старте</text>
          </g>

        </g>

        <!-- Стрелки между шагами -->
        <g stroke="#1A1714" stroke-width="1.5" fill="#1A1714">
          <line x1="360" y1="370" x2="378" y2="370" stroke-width="1.5"/>
          <polygon points="378,366 384,370 378,374"/>
        </g>
        <g stroke="#1A1714" stroke-width="1.5" fill="#1A1714">
          <line x1="720" y1="370" x2="738" y2="370" stroke-width="1.5"/>
          <polygon points="738,366 744,370 738,374"/>
        </g>
        <g stroke="#1A1714" stroke-width="1.5" fill="#1A1714">
          <line x1="1080" y1="370" x2="1098" y2="370" stroke-width="1.5"/>
          <polygon points="1098,366 1104,370 1098,374"/>
        </g>

        <!-- ===== ПОДПИСЬ ВОЗВРАТНОЙ ПЕТЛИ ===== -->
        <g>
          <!-- маска цвета paper, чтобы дуга не пересекала текст -->
          <rect x="180" y="585" width="1080" height="26" fill="#EFEBE7"/>
          <text x="720" y="603" font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle" letter-spacing="1.5">ПРАВИЛО ЛОЖИТСЯ В ФАЙЛ · CODEX ЧИТАЕТ ЕГО ПЕРЕД СЛЕДУЮЩИМ ЗАПУСКОМ</text>
        </g>

        <!-- ===== ПЛАШКА «ЧТО ДАЛЬШЕ» + АНОНС ===== -->
        <g transform="translate(20, 638)">
          <rect x="0" y="0" width="1400" height="112" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>
          <rect x="0" y="0" width="220" height="112" fill="#1A1714"/>
          <text x="110" y="50" font-family="Unbounded" font-weight="800" font-size="13" fill="#EFEBE7" text-anchor="middle" letter-spacing="1">ЧТО ДАЛЬШЕ</text>
          <text x="110" y="70" font-family="Inter Tight" font-size="11" fill="#B8B3AD" text-anchor="middle">фаза разбора</text>

          <g font-family="Inter Tight" font-size="14" fill="#1A1714" font-weight="500" transform="translate(244, 0)">
            <text x="0" y="32">Сбой ложится в реестр недостатков системы.</text>
            <text x="0" y="54">На ближайшей контрольной вышке разбор: что в маршруте могло привести к остановке</text>
            <text x="0" y="72">и стоит ли пересобирать архитектуру обратной записи.</text>
            <text x="0" y="98" font-family="Unbounded" font-weight="700" font-size="11" fill="#D62219" letter-spacing="1.2">РЕГУЛЯРНЫЕ ПРОЦЕДУРЫ ПРОВЕРКИ ЗДОРОВЬЯ СИСТЕМЫ · НА ВЕБИНАРЕ И ИНТЕНСИВЕ</text>
          </g>
        </g>

      </svg>
    </div>

    <!-- RULE: хук Ильи -->
    <div class="rule">
      <div class="mark">!</div>
      <div class="label">Итог</div>
      <div class="body">
        Хороший AI в управлении не безошибочная печатная машинка.
        <strong>Это система, которая умеет превращать сбой в улучшение процесса.</strong>
      </div>
    </div>

  </div>

</div>

<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
