<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Контрольная вышка — editorial v3</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEBE7;
    --ink: #1A1714;
    --red: #D62219;
    --muted: #B8B3AD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--paper);
    font-family: 'Inter Tight', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .slide {
    width: 1600px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: var(--paper);
  }

  /* ФОН */
  .bg {
    position: absolute; inset: 0;
    z-index: 0;
  }
  .bg .marks {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill;
  }

  /* СЛОЙ КОНТЕНТА */
  .layer {
    position: absolute; inset: 0;
    z-index: 2;
    padding: 72px 80px 0 80px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    row-gap: 32px;
  }

  .header { display: block; margin-bottom: 8px; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before {
    content: "";
    position: absolute; left: 0; top: 16px; bottom: 28px;
    width: 6px; background: var(--red);
  }
  .topline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--red);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 108px;
    line-height: 0.94;
    letter-spacing: -0.025em;
    text-transform: uppercase;
    color: var(--ink);
  }
  h1 .dot { color: var(--red); }

  .scheme {
    position: relative;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scheme svg {
    width: 100%;
    max-width: 1440px;
    height: auto;
  }

  .rule {
    margin: 0 0 110px 0;
    border: 1.5px solid var(--ink);
    padding: 28px 32px;
    display: grid;
    grid-template-columns: 60px auto 1fr;
    gap: 28px;
    align-items: center;
    background: var(--paper);
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }
  .rule .mark {
    width: 56px; height: 56px;
    border: 2px solid var(--red); border-radius: 50%;
    display: grid; place-items: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 800; font-size: 32px; color: var(--red);
  }
  .rule .label {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.5px;
    position: relative; padding-left: 16px;
    white-space: nowrap;
  }
  .rule .label::before {
    content: ""; position: absolute;
    left: 0; top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; background: var(--red);
  }
  .rule .body { font-size: 17px; line-height: 1.55; }
  .rule .body strong {
    font-weight: 700; color: var(--red);
    text-transform: uppercase; letter-spacing: 0.5px;
    font-family: 'Unbounded', sans-serif; font-size: 14px;
  }
</style>
</head>
<body>
<div class="slide">

  <div class="bg">
    <img class="marks" src="../backgrounds/09_grid_corner_glow.png" alt="">
  </div>

  <div class="layer">

    <div class="header">
      <div class="title-block">
        <div class="topline">PP.MEDIA · И_И_ · выпуск 08</div>
        <h1>Контрольная<br>вышка<span class="dot">.</span></h1>
      </div>
    </div>

    <!-- СХЕМА: 5 контуров → Codex → повестка → собственник → 17 решений -->
    <div class="scheme">
      <svg viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ===== ЛЕВО: 5 контуров управления ===== -->
        <g font-family="Inter Tight" fill="#1A1714">
          <text x="20" y="20" font-family="Unbounded" font-weight="700" font-size="12" fill="#D62219" letter-spacing="1">5 КОНТУРОВ</text>
          <!-- 01 Paper Planes -->
          <g transform="translate(20, 40)">
            <rect x="0" y="0" width="260" height="56" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>
            <text x="18" y="22" font-size="11" font-weight="600" fill="#D62219">01</text>
            <text x="42" y="23" font-size="13" font-weight="600">Paper Planes</text>
            <text x="42" y="42" font-size="11" fill="#6E6963">консалтинг, агентство</text>
          </g>
          <g transform="translate(20, 112)">
            <rect x="0" y="0" width="260" height="56" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>
            <text x="18" y="22" font-size="11" font-weight="600" fill="#D62219">02</text>
            <text x="42" y="23" font-size="13" font-weight="600">Бизнес-школа</text>
            <text x="42" y="42" font-size="11" fill="#6E6963">образование собственников</text>
          </g>
          <g transform="translate(20, 184)">
            <rect x="0" y="0" width="260" height="56" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>
            <text x="18" y="22" font-size="11" font-weight="600" fill="#D62219">03</text>
            <text x="42" y="23" font-size="13" font-weight="600">«Стрела»</text>
            <text x="42" y="42" font-size="11" fill="#6E6963">программа для малого бизнеса</text>
          </g>
          <g transform="translate(20, 256)">
            <rect x="0" y="0" width="260" height="56" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>
            <text x="18" y="22" font-size="11" font-weight="600" fill="#D62219">04</text>
            <text x="42" y="23" font-size="13" font-weight="600">Мув</text>
            <text x="42" y="42" font-size="11" fill="#6E6963">медиа</text>
          </g>
          <g transform="translate(20, 328)">
            <rect x="0" y="0" width="260" height="56" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>
            <text x="18" y="22" font-size="11" font-weight="600" fill="#D62219">05</text>
            <text x="42" y="23" font-size="13" font-weight="600">Программа для детей</text>
            <text x="42" y="42" font-size="11" fill="#6E6963">образование</text>
          </g>
          <text x="20" y="412" font-size="11" fill="#6E6963" font-style="italic">…инциденты, отклонения, противоречия в реестрах</text>
        </g>

        <!-- ===== ЛИНИИ от контуров к Codex ===== -->
        <g stroke="#1A1714" stroke-width="1.3" fill="none">
          <path d="M280 68 C 360 68, 440 168, 540 198"/>
          <path d="M280 140 C 360 140, 440 188, 540 210"/>
          <path d="M280 212 C 360 212, 440 212, 540 220"/>
          <path d="M280 284 C 360 284, 440 240, 540 232"/>
          <path d="M280 356 C 360 356, 440 268, 540 244"/>
        </g>
        <g fill="#D62219">
          <circle cx="540" cy="198" r="3.5"/>
          <circle cx="540" cy="210" r="3.5"/>
          <circle cx="540" cy="220" r="3.5"/>
          <circle cx="540" cy="232" r="3.5"/>
          <circle cx="540" cy="244" r="3.5"/>
        </g>

        <!-- ===== ЦЕНТР: Codex собирает повестку ===== -->
        <g transform="translate(560, 160)">
          <rect x="0" y="0" width="280" height="160" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect x="0" y="0" width="280" height="40" fill="#1A1714"/>
          <text x="140" y="27" font-family="Unbounded" font-weight="800" font-size="20" fill="#EFEBE7" text-anchor="middle" letter-spacing="2">CODEX</text>

          <text x="140" y="68" font-family="Inter Tight" font-size="12" font-weight="600" fill="#1A1714" text-anchor="middle">шаги внутри Codex:</text>

          <!-- 4 строки повестки -->
          <g font-family="Inter Tight" font-size="11.5" fill="#1A1714">
            <rect x="20" y="80" width="3" height="3" fill="#D62219"/>
            <text x="32" y="86">сбор инцидентов и отклонений</text>
            <rect x="20" y="96" width="3" height="3" fill="#D62219"/>
            <text x="32" y="102">отметка тех, что обсуждать</text>
            <rect x="20" y="112" width="3" height="3" fill="#D62219"/>
            <text x="32" y="118">постановка встречи в календарь</text>
            <rect x="20" y="128" width="3" height="3" fill="#D62219"/>
            <text x="32" y="134">отправка повестки с приоритетами</text>
          </g>

          <text x="140" y="186" font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle" letter-spacing="0.5">ПОВЕСТКА</text>
          <text x="140" y="206" font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle" letter-spacing="0.5">БЕЗ МОЕГО УЧАСТИЯ</text>
        </g>

        <!-- Стрелка от Codex к собственнику/решениям -->
        <g transform="translate(840, 235)">
          <line x1="0" y1="0" x2="80" y2="0" stroke="#1A1714" stroke-width="2"/>
          <polygon points="80,-6 96,0 80,6" fill="#1A1714"/>
        </g>

        <!-- ===== ПРАВО: контрольная вышка (силуэт-схема) + 17 решений ===== -->

        <!-- Башня -->
        <g transform="translate(960, 80)" fill="none" stroke="#1A1714" stroke-width="2">
          <!-- столб -->
          <line x1="60" y1="100" x2="60" y2="280" stroke-width="2.5"/>
          <!-- основание -->
          <line x1="20" y1="280" x2="100" y2="280" stroke-width="2.5"/>
          <!-- кабина (трапеция) -->
          <path d="M20 100 L100 100 L88 60 L32 60 Z" fill="#EFEBE7"/>
          <!-- окно кабины (4 деления) -->
          <line x1="40" y1="70" x2="40" y2="95"/>
          <line x1="60" y1="70" x2="60" y2="95"/>
          <line x1="80" y1="70" x2="80" y2="95"/>
          <line x1="32" y1="80" x2="88" y2="80"/>
          <!-- крыша -->
          <path d="M28 60 L92 60 L60 30 Z" fill="#1A1714" stroke="#1A1714"/>
          <!-- флажок -->
          <line x1="60" y1="30" x2="60" y2="14" stroke="#D62219" stroke-width="2.5"/>
          <path d="M60 14 L80 18 L60 24 Z" fill="#D62219" stroke="none"/>

          <text x="60" y="306" font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle" letter-spacing="0.5">СОБСТВЕННИК</text>
          <text x="60" y="324" font-family="Inter Tight" font-size="11" fill="#1A1714" text-anchor="middle" opacity="0.7">принимает решение</text>
        </g>

        <!-- Большой круг с «17» -->
        <g transform="translate(1180, 110)">
          <circle cx="110" cy="110" r="108" fill="#EFEBE7" stroke="#D62219" stroke-width="2.5"/>
          <circle cx="110" cy="110" r="86" fill="none" stroke="#D62219" stroke-width="1" stroke-dasharray="3 3"/>
          <text x="110" y="100" font-family="Unbounded" font-weight="900" font-size="84" fill="#D62219" text-anchor="middle">17</text>
          <text x="110" y="138" font-family="Unbounded" font-weight="700" font-size="14" fill="#1A1714" text-anchor="middle" letter-spacing="1">РЕШЕНИЙ</text>
          <text x="110" y="158" font-family="Unbounded" font-weight="700" font-size="14" fill="#1A1714" text-anchor="middle" letter-spacing="1">ЗА ЧАС</text>
          <text x="110" y="246" font-family="Inter Tight" font-size="11" fill="#1A1714" text-anchor="middle" opacity="0.7">вместо двух за день</text>
        </g>

        <!-- ===== ПОДПИСИ ФАЗ ===== -->
        <g font-family="Inter Tight" fill="#1A1714" opacity="0.7">
          <text x="150" y="500" font-size="11" text-anchor="middle">CODEX СОБРАЛ</text>
          <text x="700" y="500" font-size="11" text-anchor="middle">CODEX ПОДГОТОВИЛ</text>
          <text x="1200" y="500" font-size="11" text-anchor="middle">СОБСТВЕННИК РЕШИЛ</text>
        </g>
        <g stroke="#B8B3AD" stroke-width="0.8" stroke-dasharray="2 3">
          <line x1="20" y1="480" x2="280" y2="480"/>
          <line x1="560" y1="480" x2="840" y2="480"/>
          <line x1="1080" y1="480" x2="1320" y2="480"/>
        </g>

      </svg>
    </div>

    <!-- RULE -->
    <div class="rule">
      <div class="mark">!</div>
      <div class="label">Зачем</div>
      <div class="body">
        Больше задач при меньшей когнитивной нагрузке. Обычно эти два показателя расходятся.
        <strong>Зрелая система держит их вместе.</strong>
      </div>
    </div>

  </div>

</div>

<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
