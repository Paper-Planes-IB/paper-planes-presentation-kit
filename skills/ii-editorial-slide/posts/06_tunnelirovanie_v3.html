<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Туннелирование сигнала — editorial v3</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEBE7;
    --paper-dim: #E7E2DC;
    --ink: #1A1714;
    --red: #D62219;
    --muted: #B8B3AD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--paper);
    font-family: 'Inter Tight', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .slide {
    width: 1600px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: var(--paper);
  }

  /* ===== ФОН под всем композитом ===== */
  .bg {
    position: absolute; inset: 0;
    z-index: 0;
  }
  .bg .marks {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill; /* растягиваем фон на весь холст без обрезки */
  }
  /* Горячая точка фокуса — над Codex'ом, без жёсткой границы.
     Делаем чистым CSS radial-gradient, чтобы свечение растворялось,
     а не выглядело «вырезанным куском». */
  .bg::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(
        ellipse 820px 620px at 30% 58%,
        rgba(214, 34, 25, 0.32) 0%,
        rgba(214, 34, 25, 0.18) 30%,
        rgba(214, 34, 25, 0.06) 55%,
        transparent 80%
      );
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  /* ===== СЛОЙ КОНТЕНТА ===== */
  .layer {
    position: absolute; inset: 0;
    z-index: 2;
    padding: 72px 80px 0 80px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    row-gap: 32px;
  }

  /* HEADER: красная плашка + заголовок (meta вынесена в абсолют) */
  .header {
    display: block;
    margin-bottom: 8px;
  }
  .title-block {
    position: relative;
    padding-left: 26px;
  }
  .title-block::before {
    content: "";
    position: absolute; left: 0; top: 16px; bottom: 28px;
    width: 6px; background: var(--red);
  }
  .topline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--red);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 108px;
    line-height: 0.94;
    letter-spacing: -0.025em;
    text-transform: uppercase;
    color: var(--ink);
  }
  h1 .dot { color: var(--red); }
  .lead {
    margin-top: 20px;
    max-width: 760px;
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink);
    font-weight: 500;
  }
  .lead em {
    font-style: normal;
    color: var(--red);
    font-weight: 600;
  }

  .meta {
    position: absolute;
    top: 72px; right: 80px;
    z-index: 3;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.6;
    color: var(--ink);
    letter-spacing: 0.5px;
  }
  .meta .channel {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--red);
    margin-bottom: 6px;
  }

  /* MAIN: схема туннеля */
  .scheme {
    position: relative;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scheme svg {
    width: 100%;
    max-width: 1440px;
    height: auto;
  }

  /* RULE */
  .rule {
    margin: 0 0 110px 0;
    border: 1.5px solid var(--ink);
    padding: 28px 32px;
    display: grid;
    grid-template-columns: 60px auto 1fr;
    gap: 28px;
    align-items: center;
    background: var(--paper);
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }
  .rule .mark {
    width: 56px; height: 56px;
    border: 2px solid var(--red); border-radius: 50%;
    display: grid; place-items: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 800; font-size: 32px; color: var(--red);
  }
  .rule .label {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.5px;
    position: relative; padding-left: 16px;
    white-space: nowrap;
  }
  .rule .label::before {
    content: ""; position: absolute;
    left: 0; top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; background: var(--red);
  }
  .rule .body { font-size: 17px; line-height: 1.55; }
  .rule .body strong {
    font-weight: 700; color: var(--red);
    text-transform: uppercase; letter-spacing: 0.5px;
    font-family: 'Unbounded', sans-serif; font-size: 14px;
  }
</style>
</head>
<body>
<div class="slide">

  <!-- ===== ФОН (full-bleed): editorial-marks растянут + CSS-glow в зоне Codex ===== -->
  <div class="bg">
    <img class="marks" src="../backgrounds/04_editorial_marks.png" alt="">
  </div>

  <!-- ===== КОНТЕНТ ===== -->
  <div class="layer">

    <!-- HEADER -->
    <div class="header">
      <div class="title-block">
        <div class="topline">PP.MEDIA · И_И_ · выпуск 06</div>
        <h1>Туннелирование<br>сигнала<span class="dot">.</span></h1>
      </div>
    </div>


    <!-- MAIN: схема туннеля -->
    <div class="scheme">
      <svg viewBox="0 0 1440 440" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ===== 01 ВХОДЯЩИЙ СИГНАЛ (документ) ===== -->
        <g transform="translate(20, 150)">
          <!-- круг-номер -->
          <circle cx="40" cy="-58" r="22" fill="none" stroke="#D62219" stroke-width="2"/>
          <text x="40" y="-52" font-family="Unbounded" font-weight="800" font-size="16" fill="#D62219" text-anchor="middle">01</text>

          <!-- акцентные искры -->
          <g opacity="0.85">
            <circle cx="-8" cy="60" r="20" fill="#D62219" opacity="0.18"/>
            <circle cx="2" cy="78" r="9" fill="#D62219" opacity="0.45"/>
            <circle cx="18" cy="48" r="5" fill="#D62219" opacity="0.7"/>
          </g>

          <!-- документ -->
          <path d="M0 0 L78 0 L102 24 L102 138 L0 138 Z" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <path d="M78 0 L78 24 L102 24" fill="none" stroke="#1A1714" stroke-width="2"/>
          <line x1="16" y1="44" x2="86" y2="44" stroke="#1A1714" stroke-width="1.5"/>
          <line x1="16" y1="62" x2="86" y2="62" stroke="#1A1714" stroke-width="1.5"/>
          <line x1="16" y1="80" x2="86" y2="80" stroke="#1A1714" stroke-width="1.5"/>
          <line x1="16" y1="98" x2="64" y2="98" stroke="#1A1714" stroke-width="1.5"/>
          <line x1="16" y1="116" x2="76" y2="116" stroke="#1A1714" stroke-width="1.5"/>

          <text x="51" y="170" font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle" letter-spacing="0.5">ВХОДЯЩИЙ</text>
          <text x="51" y="188" font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle" letter-spacing="0.5">СИГНАЛ</text>
          <text x="51" y="208" font-family="Inter Tight" font-size="12" fill="#1A1714" text-anchor="middle" opacity="0.7">отчёт · статья · встреча</text>
        </g>

        <!-- стрелка к Codex -->
        <g transform="translate(140, 220)">
          <line x1="0" y1="0" x2="100" y2="0" stroke="#1A1714" stroke-width="2"/>
          <polygon points="100,-6 116,0 100,6" fill="#1A1714"/>
        </g>

        <!-- ===== 02 CODEX ИЩЕТ МЕСТА ПРИЗЕМЛЕНИЯ ===== -->
        <g transform="translate(280, 150)">
          <circle cx="120" cy="-58" r="22" fill="none" stroke="#D62219" stroke-width="2"/>
          <text x="120" y="-52" font-family="Unbounded" font-weight="800" font-size="16" fill="#D62219" text-anchor="middle">02</text>

          <rect x="0" y="0" width="240" height="138" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect x="0" y="0" width="240" height="36" fill="#1A1714"/>
          <text x="120" y="25" font-family="Unbounded" font-weight="800" font-size="20" fill="#EFEBE7" text-anchor="middle" letter-spacing="2">CODEX</text>

          <text x="120" y="68" font-family="Inter Tight" font-size="13" font-weight="500" fill="#1A1714" text-anchor="middle">сканирует Vault</text>
          <text x="120" y="86" font-family="Inter Tight" font-size="13" font-weight="500" fill="#1A1714" text-anchor="middle">по правилам разнесения</text>

          <!-- мини-иконки папок -->
          <g transform="translate(60, 102)">
            <rect x="0" y="0" width="20" height="14" fill="none" stroke="#1A1714" stroke-width="1.2"/>
            <rect x="32" y="0" width="20" height="14" fill="none" stroke="#1A1714" stroke-width="1.2"/>
            <rect x="64" y="0" width="20" height="14" fill="none" stroke="#1A1714" stroke-width="1.2"/>
            <rect x="96" y="0" width="20" height="14" fill="none" stroke="#1A1714" stroke-width="1.2"/>
          </g>

          <text x="120" y="170" font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle" letter-spacing="0.5">МЕСТА</text>
          <text x="120" y="188" font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle" letter-spacing="0.5">ПРИЗЕМЛЕНИЯ</text>
        </g>

        <!-- веер связей Codex → 4 дома -->
        <g>
          <path d="M540 200 C 600 200, 660 100, 770 95" stroke="#1A1714" stroke-width="1.5" fill="none"/>
          <path d="M540 220 C 600 220, 660 175, 770 175" stroke="#1A1714" stroke-width="1.5" fill="none"/>
          <path d="M540 240 C 600 240, 660 250, 770 255" stroke="#1A1714" stroke-width="1.5" fill="none"/>
          <path d="M540 260 C 600 260, 660 320, 770 335" stroke="#B8B3AD" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
          <circle cx="760" cy="95" r="4" fill="#D62219"/>
          <circle cx="760" cy="175" r="4" fill="#D62219"/>
          <circle cx="760" cy="255" r="4" fill="#D62219"/>
          <circle cx="760" cy="335" r="4" fill="#B8B3AD"/>
        </g>

        <!-- ===== 03 ЧЕЛОВЕК ПОДТВЕРЖДАЕТ (4 дома с галочками/крестом) ===== -->
        <g transform="translate(770, 50)">
          <circle cx="160" cy="0" r="22" fill="none" stroke="#D62219" stroke-width="2"/>
          <text x="160" y="6" font-family="Unbounded" font-weight="800" font-size="16" fill="#D62219" text-anchor="middle">03</text>
        </g>

        <g font-family="Inter Tight" fill="#1A1714">
          <!-- дом 1 -->
          <g transform="translate(770, 76)">
            <rect x="0" y="0" width="340" height="42" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5" rx="2"/>
            <path d="M14 14 L26 14 L30 18 L42 18 L42 32 L14 32 Z" fill="none" stroke="#1A1714" stroke-width="1.5"/>
            <text x="58" y="28" font-size="14" font-weight="600">Стратегия 26–29</text>
            <circle cx="305" cy="21" r="13" fill="#FFFFFF" stroke="#D62219" stroke-width="1.5"/>
            <path d="M299 21 L303 25 L311 17" stroke="#D62219" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <!-- дом 2 -->
          <g transform="translate(770, 156)">
            <rect x="0" y="0" width="340" height="42" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5" rx="2"/>
            <path d="M14 14 L26 14 L30 18 L42 18 L42 32 L14 32 Z" fill="none" stroke="#1A1714" stroke-width="1.5"/>
            <text x="58" y="28" font-size="14" font-weight="600">Витрина услуг</text>
            <circle cx="305" cy="21" r="13" fill="#FFFFFF" stroke="#D62219" stroke-width="1.5"/>
            <path d="M299 21 L303 25 L311 17" stroke="#D62219" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <!-- дом 3 -->
          <g transform="translate(770, 236)">
            <rect x="0" y="0" width="340" height="42" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5" rx="2"/>
            <path d="M14 14 L26 14 L30 18 L42 18 L42 32 L14 32 Z" fill="none" stroke="#1A1714" stroke-width="1.5"/>
            <text x="58" y="28" font-size="14" font-weight="600">Контент-план недели</text>
            <circle cx="305" cy="21" r="13" fill="#FFFFFF" stroke="#D62219" stroke-width="1.5"/>
            <path d="M299 21 L303 25 L311 17" stroke="#D62219" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <!-- дом 4 (отклонён) -->
          <g transform="translate(770, 316)" opacity="0.55">
            <rect x="0" y="0" width="340" height="42" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.5" rx="2" stroke-dasharray="4 3"/>
            <path d="M14 14 L26 14 L30 18 L42 18 L42 32 L14 32 Z" fill="none" stroke="#B8B3AD" stroke-width="1.5"/>
            <text x="58" y="28" font-size="14" font-weight="600" fill="#8A857A">Реестр методических артефактов</text>
            <circle cx="305" cy="21" r="13" fill="#FFFFFF" stroke="#8A857A" stroke-width="1.5"/>
            <path d="M299 15 L311 27 M311 15 L299 27" stroke="#8A857A" stroke-width="2" fill="none" stroke-linecap="round"/>
          </g>
        </g>

        <!-- стрелки от подтверждённых домов к сводке (04 → 05) -->
        <g>
          <circle cx="1140" cy="270" r="22" fill="none" stroke="#D62219" stroke-width="2"/>
          <text x="1140" y="276" font-family="Unbounded" font-weight="800" font-size="16" fill="#D62219" text-anchor="middle">04</text>
        </g>

        <g stroke="#D62219" stroke-width="1.6" fill="none">
          <path d="M1110 97 C 1170 100, 1210 200, 1240 250"/>
          <path d="M1110 177 C 1170 180, 1210 220, 1240 252"/>
          <path d="M1110 257 C 1170 258, 1210 255, 1240 254"/>
          <path d="M1110 337 C 1170 320, 1210 275, 1240 256" stroke-dasharray="5 3" stroke="#B8B3AD"/>
        </g>

        <!-- ===== 05 СВОДКА ===== -->
        <g transform="translate(1240, 170)">
          <circle cx="80" cy="-58" r="22" fill="none" stroke="#D62219" stroke-width="2"/>
          <text x="80" y="-52" font-family="Unbounded" font-weight="800" font-size="16" fill="#D62219" text-anchor="middle">05</text>

          <!-- большой круг прицела -->
          <circle cx="80" cy="80" r="78" fill="#EFEBE7" stroke="#D62219" stroke-width="2"/>
          <circle cx="80" cy="80" r="56" fill="none" stroke="#D62219" stroke-width="1" stroke-dasharray="3 3"/>
          <circle cx="80" cy="80" r="32" fill="none" stroke="#D62219" stroke-width="0.8" stroke-dasharray="2 2"/>

          <!-- мини-список внутри -->
          <g transform="translate(54, 60)">
            <rect x="-10" y="0" width="4" height="4" fill="#D62219"/>
            <line x1="0" y1="2" x2="60" y2="2" stroke="#1A1714" stroke-width="2"/>
            <rect x="-10" y="10" width="4" height="4" fill="#D62219"/>
            <line x1="0" y1="12" x2="46" y2="12" stroke="#1A1714" stroke-width="2"/>
            <rect x="-10" y="20" width="4" height="4" fill="#D62219"/>
            <line x1="0" y1="22" x2="54" y2="22" stroke="#1A1714" stroke-width="2"/>
            <rect x="-10" y="30" width="4" height="4" fill="#D62219"/>
            <line x1="0" y1="32" x2="36" y2="32" stroke="#1A1714" stroke-width="2"/>
          </g>

          <text x="80" y="200" font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle" letter-spacing="0.5">СВОДКА</text>
          <text x="80" y="218" font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle" letter-spacing="0.5">ПО ВСЕМ ДОМАМ</text>
          <text x="80" y="238" font-family="Inter Tight" font-size="12" fill="#1A1714" text-anchor="middle" opacity="0.7">гипотеза · аргумент · тема</text>
        </g>

        <!-- ===== подписи под фазами 02→03→04 ===== -->
        <g font-family="Inter Tight" fill="#1A1714" opacity="0.7">
          <text x="400" y="430" font-size="11" text-anchor="middle">машина ищет</text>
          <text x="940" y="430" font-size="11" text-anchor="middle">человек подтверждает</text>
        </g>
        <g stroke="#B8B3AD" stroke-width="0.8" stroke-dasharray="2 3">
          <line x1="280" y1="410" x2="540" y2="410"/>
          <line x1="770" y1="410" x2="1110" y2="410"/>
        </g>

      </svg>
    </div>

    <!-- RULE -->
    <div class="rule">
      <div class="mark">!</div>
      <div class="label">Главное<br>правило</div>
      <div class="body">
        Машина ничего не разносит без явного «да» от человека. Я отвечаю за смысл, машина за скорость работы.
        <strong>Это и есть human in the loop.</strong>
      </div>
    </div>

  </div>

</div>

<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
