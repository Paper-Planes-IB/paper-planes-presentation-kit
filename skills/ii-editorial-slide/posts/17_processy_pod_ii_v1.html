<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Процессы, собранные под ИИ — editorial v1</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEBE7;
    --ink: #1A1714;
    --red: #D62219;
    --muted: #B8B3AD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--paper);
    font-family: 'Inter Tight', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .slide {
    width: 1600px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: var(--paper);
  }

  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg .marks {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill;
  }

  .layer {
    position: absolute; inset: 0;
    z-index: 2;
    padding: 64px 80px 0 80px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    row-gap: 20px;
  }

  .header { display: block; margin-bottom: 4px; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before {
    content: "";
    position: absolute; left: 0; top: 12px; bottom: 18px;
    width: 6px; background: var(--red);
  }
  .topline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--red);
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 82px;
    line-height: 1.02;
    letter-spacing: -0.025em;
    text-transform: uppercase;
    color: var(--ink);
  }
  h1 .dot { color: var(--red); }

  .scheme {
    position: relative; margin: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .scheme svg { width: 100%; max-width: 1440px; height: auto; }

  .rule {
    margin: 0 0 64px 0;
    border: 1.5px solid var(--ink);
    padding: 22px 28px;
    display: grid;
    grid-template-columns: 60px auto 1fr;
    gap: 28px;
    align-items: center;
    background: var(--paper);
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }
  .rule .mark {
    width: 56px; height: 56px;
    border: 2px solid var(--red); border-radius: 50%;
    display: grid; place-items: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 800; font-size: 32px; color: var(--red);
  }
  .rule .label {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.5px;
    position: relative; padding-left: 16px;
    white-space: nowrap;
  }
  .rule .label::before {
    content: ""; position: absolute;
    left: 0; top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; background: var(--red);
  }
  .rule .body { font-size: 17px; line-height: 1.5; }
  .rule .body strong {
    font-weight: 700; color: var(--red);
  }
</style>
</head>
<body>
<div class="slide">

  <div class="bg">
    <img class="marks" src="../backgrounds/08_thin_lines_right.png" alt="">
  </div>

  <div class="layer">

    <div class="header">
      <div class="title-block">
        <div class="topline">PP.MEDIA · И_И_ · операционная модель</div>
        <h1>Процессы,<br>собранные<br>под&nbsp;ИИ<span class="dot">.</span></h1>
      </div>
    </div>

    <!-- СХЕМА: перфорированный процесс vs замкнутая петля озеро↔рельса + 4 свойства -->
    <div class="scheme">
      <svg viewBox="0 0 1440 612" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ================= ЛЕВО: ВСТРОИТЬ ИИ В ГОТОВЫЙ ПРОЦЕСС ================= -->
        <text x="20" y="14" font-family="Unbounded" font-weight="700" font-size="13" fill="#D62219" letter-spacing="1.2">ИИ ВСТРОЕН В ГОТОВЫЙ ПРОЦЕСС</text>
        <rect x="20" y="24" width="660" height="346" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.2" stroke-dasharray="5 4"/>

        <!-- база процесса: 4 ручных шага с разрывами между ними -->
        <g font-family="Inter Tight">
          <!-- шаги -->
          <g>
            <rect x="60" y="150" width="110" height="56" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.4"/>
            <text x="115" y="175" font-size="13" fill="#6E6963" text-anchor="middle">шаг</text>
            <text x="115" y="193" font-family="JetBrains Mono" font-size="10" fill="#9A958E" text-anchor="middle">ручной</text>
          </g>
          <g>
            <rect x="230" y="150" width="110" height="56" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.4"/>
            <text x="285" y="175" font-size="13" fill="#6E6963" text-anchor="middle">шаг</text>
            <text x="285" y="193" font-family="JetBrains Mono" font-size="10" fill="#9A958E" text-anchor="middle">ручной</text>
          </g>
          <g>
            <rect x="400" y="150" width="110" height="56" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.4"/>
            <text x="455" y="175" font-size="13" fill="#6E6963" text-anchor="middle">шаг</text>
            <text x="455" y="193" font-family="JetBrains Mono" font-size="10" fill="#9A958E" text-anchor="middle">ручной</text>
          </g>
          <g>
            <rect x="570" y="150" width="90" height="56" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.4"/>
            <text x="615" y="175" font-size="13" fill="#6E6963" text-anchor="middle">шаг</text>
            <text x="615" y="193" font-family="JetBrains Mono" font-size="10" fill="#9A958E" text-anchor="middle">ручной</text>
          </g>

          <!-- разрывы между шагами: рваный пунктир + крестики стыков -->
          <g stroke="#B8B3AD" stroke-width="1.4" stroke-dasharray="3 5">
            <line x1="170" y1="178" x2="230" y2="178"/>
            <line x1="340" y1="178" x2="400" y2="178"/>
            <line x1="510" y1="178" x2="570" y2="178"/>
          </g>
          <g stroke="#9A958E" stroke-width="1.3">
            <path d="M196 170 l8 16 M204 170 l-8 16"/>
            <path d="M366 170 l8 16 M374 170 l-8 16"/>
            <path d="M536 170 l8 16 M544 170 l-8 16"/>
          </g>
          <text x="200" y="214" font-family="JetBrains Mono" font-size="10" fill="#9A958E" text-anchor="middle">стык</text>
          <text x="370" y="214" font-family="JetBrains Mono" font-size="10" fill="#9A958E" text-anchor="middle">стык</text>
          <text x="540" y="214" font-family="JetBrains Mono" font-size="10" fill="#9A958E" text-anchor="middle">стык</text>

          <!-- ИИ-вставки: красные пунктирные заплатки сверху, не связанные между собой -->
          <g>
            <rect x="245" y="74" width="80" height="34" fill="#EFEBE7" stroke="#D62219" stroke-width="1.4" stroke-dasharray="4 3"/>
            <text x="285" y="96" font-family="Unbounded" font-weight="700" font-size="12" fill="#D62219" text-anchor="middle">БОТ</text>
            <line x1="285" y1="108" x2="285" y2="150" stroke="#D62219" stroke-width="1.2" stroke-dasharray="3 3"/>
          </g>
          <g>
            <rect x="575" y="74" width="80" height="34" fill="#EFEBE7" stroke="#D62219" stroke-width="1.4" stroke-dasharray="4 3"/>
            <text x="615" y="96" font-family="Unbounded" font-weight="700" font-size="12" fill="#D62219" text-anchor="middle">АГЕНТ</text>
            <line x1="615" y1="108" x2="615" y2="150" stroke="#D62219" stroke-width="1.2" stroke-dasharray="3 3"/>
          </g>

          <!-- дыры -->
          <g>
            <ellipse cx="150" cy="270" rx="46" ry="22" fill="none" stroke="#B8B3AD" stroke-width="1.3" stroke-dasharray="4 4"/>
            <text x="150" y="274" font-family="JetBrains Mono" font-size="10" fill="#9A958E" text-anchor="middle">дыра</text>
            <ellipse cx="440" cy="288" rx="52" ry="24" fill="none" stroke="#B8B3AD" stroke-width="1.3" stroke-dasharray="4 4"/>
            <text x="440" y="292" font-family="JetBrains Mono" font-size="10" fill="#9A958E" text-anchor="middle">дыра</text>
          </g>
        </g>

        <text x="350" y="356" font-family="Unbounded" font-weight="700" font-size="12" fill="#D62219" text-anchor="middle" letter-spacing="0.8">ПЕРФОРИРОВАННЫЙ ПРОЦЕСС · ВСТАВКИ ПОРОЗНЬ</text>

        <!-- ================= РАЗДЕЛИТЕЛЬ ================= -->
        <g>
          <line x1="710" y1="24" x2="710" y2="370" stroke="#1A1714" stroke-width="1" stroke-dasharray="4 4"/>
          <rect x="688" y="187" width="44" height="20" fill="#EFEBE7"/>
          <text x="710" y="201" font-family="Unbounded" font-weight="800" font-size="13" fill="#D62219" text-anchor="middle">→</text>
        </g>

        <!-- ================= ПРАВО: ПРОЦЕСС СОБРАН МАШИНОЧИТАЕМЫМ ================= -->
        <text x="740" y="14" font-family="Unbounded" font-weight="700" font-size="13" fill="#D62219" letter-spacing="1.2">ПРОЦЕСС СОБРАН МАШИНОЧИТАЕМЫМ</text>
        <rect x="740" y="24" width="680" height="346" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>

        <!-- РЕЛЬСА: трасса с входом, гейтом, выходом -->
        <g>
          <text x="760" y="64" font-family="Unbounded" font-weight="700" font-size="11" fill="#1A1714" letter-spacing="1">РЕЛЬСА</text>
          <!-- две нитки рельсы + шпалы -->
          <line x1="838" y1="90" x2="1340" y2="90" stroke="#1A1714" stroke-width="1.6"/>
          <line x1="838" y1="100" x2="1340" y2="100" stroke="#1A1714" stroke-width="1.6"/>
          <g stroke="#B8B3AD" stroke-width="1.2">
            <line x1="868" y1="88" x2="868" y2="102"/>
            <line x1="928" y1="88" x2="928" y2="102"/>
            <line x1="988" y1="88" x2="988" y2="102"/>
            <line x1="1108" y1="88" x2="1108" y2="102"/>
            <line x1="1168" y1="88" x2="1168" y2="102"/>
            <line x1="1228" y1="88" x2="1228" y2="102"/>
            <line x1="1288" y1="88" x2="1288" y2="102"/>
          </g>
          <!-- вход -->
          <rect x="772" y="76" width="62" height="38" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.4"/>
          <text x="803" y="99" font-size="12" fill="#1A1714" text-anchor="middle">вход</text>
          <!-- гейт -->
          <g>
            <rect x="1030" y="70" width="30" height="50" fill="#EFEBE7" stroke="#D62219" stroke-width="1.6"/>
            <line x1="1045" y1="74" x2="1045" y2="86" stroke="#D62219" stroke-width="1.6"/>
            <line x1="1045" y1="104" x2="1045" y2="116" stroke="#D62219" stroke-width="1.6"/>
            <text x="1045" y="138" font-family="JetBrains Mono" font-size="10" fill="#D62219" text-anchor="middle">гейт</text>
          </g>
          <!-- выход -->
          <rect x="1344" y="76" width="62" height="38" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.4"/>
          <text x="1375" y="99" font-size="12" fill="#1A1714" text-anchor="middle">выход</text>
        </g>

        <!-- ОЗЕРО: резервуар нормативов -->
        <g>
          <path d="M820 250 L1300 250 L1276 320 L844 320 Z" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
          <text x="1060" y="276" font-family="Unbounded" font-weight="800" font-size="14" fill="#1A1714" text-anchor="middle" letter-spacing="1">ОЗЕРО</text>
          <g font-family="JetBrains Mono" font-size="11" fill="#1A1714">
            <text x="916" y="306" text-anchor="middle">реестры</text>
            <text x="1060" y="306" text-anchor="middle">правила</text>
            <text x="1212" y="306" text-anchor="middle">параметры</text>
          </g>
        </g>

        <!-- ШАБЛОН на входе в озеро: структурная карта проходит, свободный текст отбит -->
        <g>
          <text x="772" y="168" font-family="Unbounded" font-weight="700" font-size="11" fill="#D62219" letter-spacing="0.8">ШАБЛОН НА ВХОДЕ</text>
          <!-- структурная карта (поля) -->
          <g>
            <rect x="772" y="178" width="116" height="56" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.4"/>
            <line x1="784" y1="194" x2="876" y2="194" stroke="#1A1714" stroke-width="1"/>
            <line x1="784" y1="206" x2="876" y2="206" stroke="#1A1714" stroke-width="1"/>
            <line x1="784" y1="218" x2="848" y2="218" stroke="#1A1714" stroke-width="1"/>
            <text x="830" y="250" font-family="JetBrains Mono" font-size="10" fill="#1A1714" text-anchor="middle">поля по модели</text>
            <!-- галочка -->
            <circle cx="900" cy="206" r="13" fill="#EFEBE7" stroke="#D62219" stroke-width="1.5"/>
            <path d="M893 206 L898 211 L907 202" stroke="#D62219" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <!-- свободный текст отбит -->
          <g opacity="0.85">
            <rect x="936" y="182" width="150" height="40" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.3" stroke-dasharray="4 3"/>
            <text x="1011" y="206" font-size="12" fill="#9A958E" text-anchor="middle">«не нравится»</text>
            <circle cx="1106" cy="202" r="13" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.5"/>
            <path d="M1099 195 L1113 209 M1113 195 L1099 209" stroke="#B8B3AD" stroke-width="2" fill="none" stroke-linecap="round"/>
            <text x="1011" y="236" font-family="JetBrains Mono" font-size="10" fill="#9A958E" text-anchor="middle">в правило не положить</text>
          </g>
        </g>

        <!-- ПЕТЛЯ: выход → озеро (обратное включение), озеро → вход (норматив) -->
        <g stroke="#D62219" stroke-width="1.6" fill="none">
          <!-- норматив: из левого ребра озера → вниз-влево → вверх по краю → в грань входа -->
          <path d="M832 285 L762 285 L762 95 L766 95"/>
          <!-- обратное включение: из ребра выхода → вниз по правому краю → в ребро озера -->
          <path d="M1375 114 L1375 285 L1300 285"/>
        </g>
        <g fill="#D62219" stroke="none">
          <polygon points="766,90 766,100 776,95"/>
          <polygon points="1300,280 1300,290 1290,285"/>
        </g>
        <g font-family="JetBrains Mono" font-size="11" fill="#D62219">
          <text x="797" y="278" text-anchor="middle">норматив</text>
          <text x="1322" y="172" text-anchor="middle">обратное</text>
          <text x="1322" y="186" text-anchor="middle">включение</text>
        </g>

        <text x="1080" y="356" font-family="Unbounded" font-weight="700" font-size="12" fill="#D62219" text-anchor="middle" letter-spacing="0.8">ЗАМКНУТАЯ ПЕТЛЯ · ОЗЕРО И РЕЛЬСА</text>

        <!-- ================= НИЗ: 4 СВОЙСТВА «СОБРАН ПОД ИИ» ================= -->
        <text x="0" y="406" font-family="Unbounded" font-weight="700" font-size="11" fill="#D62219" letter-spacing="1.5">ЧТО ЗНАЧИТ СОБРАН ПОД ИИ</text>

        <g transform="translate(0, 418)" font-family="Inter Tight">
          <g transform="translate(0,0)">
            <rect x="0" y="0" width="345" height="150" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>
            <rect x="0" y="0" width="44" height="150" fill="#1A1714"/>
            <text x="22" y="84" font-family="Unbounded" font-weight="900" font-size="20" fill="#EFEBE7" text-anchor="middle">01</text>
            <text x="60" y="34" font-family="Unbounded" font-weight="800" font-size="13" fill="#1A1714" letter-spacing="0.3">МАШИНОЧИТАЕМЫЙ ВХОД</text>
            <text x="60" y="68" font-size="13" fill="#1A1714">любой intake</text>
            <text x="60" y="89" font-size="13" fill="#1A1714">идёт через шаблон,</text>
            <text x="60" y="110" font-size="13" fill="#1A1714">свободный текст закрыт</text>
          </g>
          <g transform="translate(365,0)">
            <rect x="0" y="0" width="345" height="150" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>
            <rect x="0" y="0" width="44" height="150" fill="#1A1714"/>
            <text x="22" y="84" font-family="Unbounded" font-weight="900" font-size="20" fill="#EFEBE7" text-anchor="middle">02</text>
            <text x="60" y="34" font-family="Unbounded" font-weight="800" font-size="13" fill="#D62219" letter-spacing="0.3">ЕДИНАЯ МОДЕЛЬ ДАННЫХ</text>
            <text x="60" y="68" font-size="13" fill="#1A1714">люди, проекты,</text>
            <text x="60" y="89" font-size="13" fill="#1A1714">активы описаны</text>
            <text x="60" y="110" font-size="13" fill="#1A1714">единицами</text>
          </g>
          <g transform="translate(730,0)">
            <rect x="0" y="0" width="345" height="150" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>
            <rect x="0" y="0" width="44" height="150" fill="#1A1714"/>
            <text x="22" y="84" font-family="Unbounded" font-weight="900" font-size="20" fill="#EFEBE7" text-anchor="middle">03</text>
            <text x="60" y="34" font-family="Unbounded" font-weight="800" font-size="13" fill="#1A1714" letter-spacing="0.3">ПРОЛОЖЕННЫЕ РЕЛЬСЫ</text>
            <text x="60" y="68" font-size="13" fill="#1A1714">маршруты обработки</text>
            <text x="60" y="89" font-size="13" fill="#1A1714">заданы заранее,</text>
            <text x="60" y="110" font-size="13" fill="#1A1714">до прихода данных</text>
          </g>
          <g transform="translate(1095,0)">
            <rect x="0" y="0" width="345" height="150" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.5"/>
            <rect x="0" y="0" width="44" height="150" fill="#1A1714"/>
            <text x="22" y="84" font-family="Unbounded" font-weight="900" font-size="20" fill="#EFEBE7" text-anchor="middle">04</text>
            <text x="60" y="34" font-family="Unbounded" font-weight="800" font-size="13" fill="#1A1714" letter-spacing="0.3">ЗАМКНУТАЯ СВЯЗЬ</text>
            <text x="60" y="68" font-size="13" fill="#1A1714">выход маршрута</text>
            <text x="60" y="89" font-size="13" fill="#1A1714">возвращается</text>
            <text x="60" y="110" font-size="13" fill="#1A1714">в озеро</text>
          </g>
        </g>

      </svg>
    </div>

    <!-- RULE: финал -->
    <div class="rule">
      <div class="mark">!</div>
      <div class="label">Итог</div>
      <div class="body">
        Строить нужно процессы, заранее собранные под ИИ.
        <strong>Тогда встраивать его никуда не придётся.</strong>
      </div>
    </div>

  </div>

</div>

<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
