<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Скилл — программа методологии — editorial v3</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEBE7;
    --ink: #1A1714;
    --red: #D62219;
    --muted: #B8B3AD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--paper);
    font-family: 'Inter Tight', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .slide {
    width: 1600px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: var(--paper);
  }

  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg .marks {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    /* фон сильный, чуть гасим чтобы не давил на типографику */
    opacity: 0.55;
  }

  .layer {
    position: absolute; inset: 0;
    z-index: 2;
    padding: 72px 80px 0 80px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    row-gap: 32px;
  }

  .header { display: block; margin-bottom: 8px; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before {
    content: "";
    position: absolute; left: 0; top: 16px; bottom: 28px;
    width: 6px; background: var(--red);
  }
  .topline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--red);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 108px;
    line-height: 0.94;
    letter-spacing: -0.025em;
    text-transform: uppercase;
    color: var(--ink);
  }
  h1 .dot { color: var(--red); }

  .scheme {
    position: relative; margin: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .scheme svg { width: 100%; max-width: 1440px; height: auto; }

  .rule {
    margin: 0 0 110px 0;
    border: 1.5px solid var(--ink);
    padding: 28px 32px;
    display: grid;
    grid-template-columns: 60px auto 1fr;
    gap: 28px;
    align-items: center;
    background: var(--paper);
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }
  .rule .mark {
    width: 56px; height: 56px;
    border: 2px solid var(--red); border-radius: 50%;
    display: grid; place-items: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 800; font-size: 32px; color: var(--red);
  }
  .rule .label {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.5px;
    position: relative; padding-left: 16px;
    white-space: nowrap;
  }
  .rule .label::before {
    content: ""; position: absolute;
    left: 0; top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; background: var(--red);
  }
  .rule .body { font-size: 17px; line-height: 1.55; }
  .rule .body strong {
    font-weight: 700; color: var(--red);
    text-transform: uppercase; letter-spacing: 0.5px;
    font-family: 'Unbounded', sans-serif; font-size: 14px;
  }
</style>
</head>
<body>
<div class="slide">

  <div class="bg">
    <img class="marks" src="../backgrounds/01_grid_blocks.png" alt="">
  </div>

  <div class="layer">

    <div class="header">
      <div class="title-block">
        <div class="topline">PP.MEDIA · И_И_ · выпуск 09</div>
        <h1>Скилл<br>программа<span class="dot">.</span></h1>
      </div>
    </div>

    <!-- СХЕМА: Промпт vs Скилл -->
    <div class="scheme">
      <svg viewBox="0 0 1440 540" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ===== ЛЕВО: ПРОМПТ ===== -->
        <g transform="translate(20, 20)">
          <rect x="0" y="0" width="380" height="380" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.5" stroke-dasharray="6 4"/>
          <text x="20" y="34" font-family="Unbounded" font-weight="800" font-size="22" fill="#6E6963" letter-spacing="2">ПРОМПТ</text>
          <text x="20" y="56" font-family="Inter Tight" font-size="13" fill="#6E6963">разовая реплика</text>

          <!-- иконка облачка с репликой -->
          <g transform="translate(140, 110)" fill="none" stroke="#B8B3AD" stroke-width="1.8">
            <ellipse cx="50" cy="36" rx="60" ry="36"/>
            <path d="M30 64 L20 86 L46 70"/>
          </g>
          <text x="190" y="152" font-family="Inter Tight" font-size="11" fill="#6E6963" text-anchor="middle">«сделай мне обзор по…»</text>

          <!-- свойства -->
          <g font-family="Inter Tight" fill="#6E6963" font-size="13" transform="translate(20, 200)">
            <rect x="0" y="0" width="4" height="4" fill="#B8B3AD"/>
            <text x="14" y="6">живёт один запуск</text>
            <rect x="0" y="22" width="4" height="4" fill="#B8B3AD"/>
            <text x="14" y="28">ничего не сохраняет</text>
            <rect x="0" y="44" width="4" height="4" fill="#B8B3AD"/>
            <text x="14" y="50">через сутки результат другой</text>
            <rect x="0" y="66" width="4" height="4" fill="#B8B3AD"/>
            <text x="14" y="72">переписывать после обновления модели</text>
          </g>

          <text x="20" y="356" font-family="Unbounded" font-weight="700" font-size="11" fill="#B8B3AD" letter-spacing="1">РАЗОВАЯ РЕПЛИКА</text>
        </g>

        <!-- ===== РАЗДЕЛИТЕЛЬ между Промптом и Скиллом ===== -->
        <g transform="translate(460, 60)">
          <line x1="0" y1="0" x2="0" y2="280" stroke="#B8B3AD" stroke-width="1" stroke-dasharray="3 3"/>
          <rect x="-22" y="130" width="44" height="20" fill="#EFEBE7"/>
          <text x="0" y="144" font-family="Unbounded" font-weight="800" font-size="11" fill="#D62219" text-anchor="middle" letter-spacing="1.5">vs</text>
        </g>

        <!-- ===== ПРАВО: СКИЛЛ (расширенная карточка) ===== -->
        <g transform="translate(540, 0)">
          <rect x="0" y="0" width="600" height="420" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect x="0" y="0" width="600" height="50" fill="#1A1714"/>
          <text x="20" y="33" font-family="Unbounded" font-weight="800" font-size="22" fill="#EFEBE7" letter-spacing="2">СКИЛЛ</text>
          <text x="580" y="33" font-family="Inter Tight" font-size="13" fill="#EFEBE7" text-anchor="end">исполняемый артефакт</text>

          <!-- 9 свойств в 3 колонки -->
          <g font-family="Inter Tight" font-weight="600" font-size="13" fill="#1A1714">
            <!-- колонка 1 -->
            <g transform="translate(28, 90)">
              <rect x="0" y="-12" width="4" height="14" fill="#D62219"/>
              <text x="14" y="0">имя</text>
              <text x="14" y="18" font-size="11" fill="#6E6963" font-weight="500">идентификатор</text>
            </g>
            <g transform="translate(28, 150)">
              <rect x="0" y="-12" width="4" height="14" fill="#D62219"/>
              <text x="14" y="0">триггеры</text>
              <text x="14" y="18" font-size="11" fill="#6E6963" font-weight="500">когда вызывать</text>
            </g>
            <g transform="translate(28, 210)">
              <rect x="0" y="-12" width="4" height="14" fill="#D62219"/>
              <text x="14" y="0">входные данные</text>
              <text x="14" y="18" font-size="11" fill="#6E6963" font-weight="500">что подаём</text>
            </g>

            <!-- колонка 2 -->
            <g transform="translate(228, 90)">
              <rect x="0" y="-12" width="4" height="14" fill="#D62219"/>
              <text x="14" y="0">шаги</text>
              <text x="14" y="18" font-size="11" fill="#6E6963" font-weight="500">алгоритм исполнения</text>
            </g>
            <g transform="translate(228, 150)">
              <rect x="0" y="-12" width="4" height="14" fill="#D62219"/>
              <text x="14" y="0">проверки</text>
              <text x="14" y="18" font-size="11" fill="#6E6963" font-weight="500">контроль качества</text>
            </g>
            <g transform="translate(228, 210)">
              <rect x="0" y="-12" width="4" height="14" fill="#D62219"/>
              <text x="14" y="0">выходы</text>
              <text x="14" y="18" font-size="11" fill="#6E6963" font-weight="500">артефакты</text>
            </g>

            <!-- колонка 3 -->
            <g transform="translate(428, 90)">
              <rect x="0" y="-12" width="4" height="14" fill="#D62219"/>
              <text x="14" y="0">маршрутизация</text>
              <text x="14" y="18" font-size="11" fill="#6E6963" font-weight="500">куда направить</text>
            </g>
            <g transform="translate(428, 150)">
              <rect x="0" y="-12" width="4" height="14" fill="#D62219"/>
              <text x="14" y="0">владелец</text>
              <text x="14" y="18" font-size="11" fill="#6E6963" font-weight="500">кто отвечает</text>
            </g>
            <g transform="translate(428, 210)">
              <rect x="0" y="-12" width="4" height="14" fill="#D62219"/>
              <text x="14" y="0">журнал</text>
              <text x="14" y="18" font-size="11" fill="#6E6963" font-weight="500">история запусков</text>
            </g>
          </g>

          <!-- Свойства внизу карточки -->
          <line x1="20" y1="280" x2="580" y2="280" stroke="#1A1714" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>

          <g font-family="Inter Tight" font-size="13" fill="#1A1714" font-weight="500">
            <text x="28" y="312">Один запуск в понедельник и в пятницу даст тот же результат.</text>
            <text x="28" y="334">Любая сессия, любой сотрудник команды.</text>
            <text x="28" y="356" font-weight="600" fill="#D62219">35 скиллов в системе. Каждый закрывает одну управленческую операцию.</text>
          </g>

          <text x="28" y="394" font-family="Unbounded" font-weight="700" font-size="11" fill="#D62219" letter-spacing="1.5">ЕДИНЫЙ СТАНДАРТ КОМАНДЫ</text>
        </g>

        <!-- ===== РЕЕСТР ВНИЗУ: 35 скиллов как сетка ===== -->
        <g transform="translate(20, 450)">
          <text x="0" y="0" font-family="Unbounded" font-weight="700" font-size="11" fill="#1A1714" letter-spacing="1.5">РЕЕСТР · 35 СКИЛЛОВ</text>
          <text x="1120" y="0" font-family="Inter Tight" font-size="11" fill="#1A1714" text-anchor="end" font-style="italic" opacity="0.7">«Inspect Skills» — раз в несколько дней ревизия и модернизация</text>

          <!-- 35 квадратиков 5 рядов x 7 колонок (или 7x5) -->
          <g transform="translate(0, 16)">
            <!-- 7 колонок x 5 рядов = 35 -->
            <g fill="#1A1714">
              <!-- ряд 1 -->
              <rect x="0" y="0" width="14" height="14"/>
              <rect x="20" y="0" width="14" height="14"/>
              <rect x="40" y="0" width="14" height="14"/>
              <rect x="60" y="0" width="14" height="14"/>
              <rect x="80" y="0" width="14" height="14"/>
              <rect x="100" y="0" width="14" height="14" fill="#D62219"/>
              <rect x="120" y="0" width="14" height="14"/>
              <!-- ряд 2 -->
              <rect x="0" y="20" width="14" height="14"/>
              <rect x="20" y="20" width="14" height="14" fill="#D62219"/>
              <rect x="40" y="20" width="14" height="14"/>
              <rect x="60" y="20" width="14" height="14"/>
              <rect x="80" y="20" width="14" height="14"/>
              <rect x="100" y="20" width="14" height="14"/>
              <rect x="120" y="20" width="14" height="14"/>
              <!-- ряд 3 -->
              <rect x="0" y="40" width="14" height="14"/>
              <rect x="20" y="40" width="14" height="14"/>
              <rect x="40" y="40" width="14" height="14"/>
              <rect x="60" y="40" width="14" height="14" fill="#D62219"/>
              <rect x="80" y="40" width="14" height="14"/>
              <rect x="100" y="40" width="14" height="14"/>
              <rect x="120" y="40" width="14" height="14"/>
            </g>
          </g>

          <!-- Три именованных примера справа -->
          <g font-family="Inter Tight" fill="#1A1714" font-size="12" transform="translate(180, 8)">
            <g transform="translate(0, 0)">
              <rect x="0" y="0" width="280" height="48" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.2"/>
              <text x="12" y="20" font-family="JetBrains Mono" font-size="11" font-weight="600" fill="#D62219">concept-deepdive</text>
              <text x="12" y="38" font-size="11" fill="#1A1714">разбор новой технологии с источниками</text>
            </g>
            <g transform="translate(300, 0)">
              <rect x="0" y="0" width="280" height="48" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.2"/>
              <text x="12" y="20" font-family="JetBrains Mono" font-size="11" font-weight="600" fill="#D62219">product-growth-hypothesis</text>
              <text x="12" y="38" font-size="11" fill="#1A1714">утренняя оценка модели сервиса</text>
            </g>
            <g transform="translate(600, 0)">
              <rect x="0" y="0" width="280" height="48" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.2"/>
              <text x="12" y="20" font-family="JetBrains Mono" font-size="11" font-weight="600" fill="#D62219">pp-longread-leverage</text>
              <text x="12" y="38" font-size="11" fill="#1A1714">17 разделов фирменного лонгрида</text>
            </g>
          </g>
        </g>

      </svg>
    </div>

    <!-- RULE -->
    <div class="rule">
      <div class="mark">!</div>
      <div class="label">Эффект</div>
      <div class="body">
        Раньше автономия исполнителя и единый методологический стандарт расходились. Скилл сводит их в одну точку.
        <strong>Команда работает на уровне сильного автора без него самого.</strong>
      </div>
    </div>

  </div>

</div>

<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
