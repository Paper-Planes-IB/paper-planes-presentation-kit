<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Цикл CORD — editorial v1</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EFEBE7; --ink:#1A1714; --red:#D62219; --muted:#B8B3AD; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { background: var(--paper); font-family: 'Inter Tight', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .slide { width: 1600px; height: 1200px; position: relative; overflow: hidden; background: var(--paper); }
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg .marks { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  .layer { position: absolute; inset: 0; z-index: 2; padding: 54px 80px 0 80px; display: grid; grid-template-rows: auto 1fr auto; row-gap: 12px; }
  .header { display: block; margin-bottom: 2px; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 12px; width: 6px; background: var(--red); }
  .topline { font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--red); margin-bottom: 8px; }
  h1 { font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 82px; line-height: 1.0; letter-spacing: -0.025em; text-transform: uppercase; color: var(--ink); }
  h1 .dot { color: var(--red); }
  .scheme { position: relative; display: flex; align-items: center; justify-content: center; }
  .scheme svg { width: 100%; max-width: 1440px; height: auto; }
  .rule { margin: 0 0 80px 0; border: 1.5px solid var(--ink); padding: 22px 28px; display: grid; grid-template-columns: 60px auto 1fr; gap: 28px; align-items: center; background: var(--paper); box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
  .rule .mark { width: 56px; height: 56px; border: 2px solid var(--red); border-radius: 50%; display: grid; place-items: center; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 32px; color: var(--red); }
  .rule .label { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; position: relative; padding-left: 16px; white-space: nowrap; }
  .rule .label::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; background: var(--red); }
  .rule .body { font-size: 17px; line-height: 1.5; }
  .rule .body strong { font-weight: 700; color: var(--red); }
</style>
</head>
<body>
<div class="slide">

  <div class="bg">
    <img class="marks" src="../backgrounds/03_red_glow.png" alt="">
  </div>

  <div class="layer">

    <div class="header">
      <div class="title-block">
        <div class="topline">PP.MEDIA · И_И_ · после интенсива по управляемой ИИзации</div>
        <h1>Цикл CORD<span class="dot">.</span></h1>
      </div>
    </div>

    <div class="scheme">
      <svg viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ===== ДУГИ ЦИКЛА ПО ЧАСОВОЙ: C→O→R→D→C ===== -->
        <g stroke="#D62219" stroke-width="2.6" fill="none">
          <!-- C (верх) → O (право) -->
          <path d="M905 150 C1060 175, 1180 245, 1210 320"/>
          <!-- O (право) → R (низ) -->
          <path d="M1210 470 C1180 545, 1060 615, 905 640"/>
          <!-- R (низ) → D (лево) -->
          <path d="M535 640 C380 615, 260 545, 230 470"/>
          <!-- D (лево) → C (верх) -->
          <path d="M230 320 C260 245, 380 175, 535 150"/>
        </g>
        <g fill="#D62219" stroke="none">
          <polygon points="1206,308 1224,318 1204,326"/>   <!-- к O -->
          <polygon points="912,632 904,650 894,634"/>       <!-- к R -->
          <polygon points="234,332 216,322 236,314"/>       <!-- к D -->
          <polygon points="528,158 536,140 546,156"/>       <!-- к C -->
        </g>

        <!-- центр: метка -->
        <text x="720" y="388" font-family="Unbounded" font-weight="900" font-size="30" fill="#1A1714" text-anchor="middle" letter-spacing="2">CORD</text>
        <text x="720" y="416" font-family="JetBrains Mono" font-size="13" fill="#D62219" text-anchor="middle">цикл «думай»</text>
        <text x="720" y="436" font-family="JetBrains Mono" font-size="11" fill="#6E6963" text-anchor="middle">петля замыкается, сигнал идёт по кругу</text>

        <!-- ===== C · COLLECT (верх) ===== -->
        <g transform="translate(490,40)">
          <rect width="460" height="200" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect width="460" height="50" fill="#1A1714"/>
          <text x="18" y="38" font-family="Unbounded" font-weight="900" font-size="28" fill="#EFEBE7">C</text>
          <text x="56" y="34" font-family="Unbounded" font-weight="800" font-size="19" fill="#EFEBE7" letter-spacing="0.5">COLLECT</text>
          <text x="444" y="34" font-family="JetBrains Mono" font-size="12" fill="#B8B3AD" text-anchor="end">сбор</text>
          <text x="20" y="82" font-family="Unbounded" font-weight="800" font-size="13" fill="#D62219" letter-spacing="0.4">КАК СИГНАЛ ВХОДИТ В СИСТЕМУ</text>
          <text x="20" y="114" font-size="17" fill="#1A1714">голосовые и рукописные заметки,</text>
          <text x="20" y="140" font-size="17" fill="#1A1714">выделения в читалке, RSS-сводки,</text>
          <text x="20" y="166" font-size="17" fill="#1A1714">расшифровки встреч</text>
        </g>

        <!-- ===== O · ORGANIZE (право) ===== -->
        <g transform="translate(980,290)">
          <rect width="460" height="200" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect width="460" height="50" fill="#1A1714"/>
          <text x="18" y="38" font-family="Unbounded" font-weight="900" font-size="28" fill="#EFEBE7">O</text>
          <text x="56" y="34" font-family="Unbounded" font-weight="800" font-size="19" fill="#EFEBE7" letter-spacing="0.5">ORGANIZE</text>
          <text x="444" y="34" font-family="JetBrains Mono" font-size="12" fill="#B8B3AD" text-anchor="end">раскладка</text>
          <text x="20" y="82" font-family="Unbounded" font-weight="800" font-size="13" fill="#D62219" letter-spacing="0.4">КУДА СИГНАЛ ЛОЖИТСЯ · МОДЕЛЬ PARA</text>
          <text x="20" y="113" font-size="16" fill="#1A1714"><tspan font-weight="700">Projects</tspan> — то, что кончается · <tspan font-weight="700">Areas</tspan> — зоны</text>
          <text x="20" y="139" font-size="16" fill="#1A1714"><tspan font-weight="700">Resources</tspan> — инструменты и базы</text>
          <text x="20" y="165" font-size="16" fill="#1A1714"><tspan font-weight="700">Archive</tspan> — прошлое и прогноз по нему</text>
        </g>

        <!-- ===== R · REVIEW (низ) ===== -->
        <g transform="translate(490,520)">
          <rect width="460" height="200" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect width="460" height="50" fill="#1A1714"/>
          <text x="18" y="38" font-family="Unbounded" font-weight="900" font-size="28" fill="#EFEBE7">R</text>
          <text x="56" y="34" font-family="Unbounded" font-weight="800" font-size="19" fill="#EFEBE7" letter-spacing="0.5">REVIEW</text>
          <text x="444" y="34" font-family="JetBrains Mono" font-size="12" fill="#B8B3AD" text-anchor="end">пересмотр</text>
          <text x="20" y="82" font-family="Unbounded" font-weight="800" font-size="13" fill="#D62219" letter-spacing="0.4">КОГДА ВОЗВРАЩАЕМСЯ К ДАННЫМ</text>
          <text x="20" y="114" font-size="17" fill="#1A1714">проекты — ежедневно,</text>
          <text x="20" y="140" font-size="17" fill="#1A1714">области — раз в три дня,</text>
          <text x="20" y="166" font-size="17" fill="#1A1714">ресурсы и скиллы — раз в неделю</text>
        </g>

        <!-- ===== D · DO (лево) ===== -->
        <g transform="translate(0,290)">
          <rect width="460" height="200" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>
          <rect width="460" height="50" fill="#1A1714"/>
          <text x="18" y="38" font-family="Unbounded" font-weight="900" font-size="28" fill="#EFEBE7">D</text>
          <text x="56" y="34" font-family="Unbounded" font-weight="800" font-size="19" fill="#EFEBE7" letter-spacing="0.5">DO</text>
          <text x="444" y="34" font-family="JetBrains Mono" font-size="12" fill="#B8B3AD" text-anchor="end">действие</text>
          <text x="20" y="82" font-family="Unbounded" font-weight="800" font-size="13" fill="#D62219" letter-spacing="0.4">КОГДА СИГНАЛ СТАНОВИТСЯ ДЕЛОМ</text>
          <text x="20" y="114" font-size="17" fill="#1A1714">машина пишет задачи в базу,</text>
          <text x="20" y="140" font-size="17" fill="#1A1714">читает статусы, сигналит о застое,</text>
          <text x="20" y="166" font-size="17" fill="#1A1714">закрывает выполненное</text>
        </g>

      </svg>
    </div>

    <!-- RULE: финал -->
    <div class="rule">
      <div class="mark">!</div>
      <div class="label">Итог</div>
      <div class="body">
        Если хотя бы один из четырёх процессов не заведён — петля разваливается.
        <strong>Это рамка, в которую дальше встраивается всё остальное: машиночитаемый формат, HITL, выравнивание стыков, туннелирование.</strong>
      </div>
    </div>

  </div>

</div>

<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
