<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>БПМ-11 · Две оптики</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EFEBE7; --ink:#1A1714; --red:#D62219; --muted:#B8B3AD; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { background: var(--paper); font-family: 'Inter Tight', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .slide { width: 1600px; height: 1200px; position: relative; overflow: hidden; background: var(--paper); }
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg .marks { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  .layer { position: absolute; inset: 0; z-index: 2; padding: 58px 80px 0 80px; display: grid; grid-template-rows: auto 1fr auto; row-gap: 16px; }
  .header { display: block; margin-bottom: 2px; }
  .title-block { position: relative; padding-left: 26px; }
  .title-block::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 12px; width: 6px; background: var(--red); }
  .topline { font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--red); margin-bottom: 10px; }
  h1 { font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 92px; line-height: 1.0; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink); }
  h1 .dot { color: var(--red); }
  .scheme { position: relative; display: flex; align-items: center; justify-content: center; }
  .scheme svg { width: 100%; max-width: 1440px; height: auto; }
  .rule { margin: 0 0 80px 0; border: 1.5px solid var(--ink); padding: 22px 28px; display: grid; grid-template-columns: 60px auto 1fr; gap: 28px; align-items: center; background: var(--paper); box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
  .rule .mark { width: 56px; height: 56px; border: 2px solid var(--red); border-radius: 50%; display: grid; place-items: center; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 28px; color: var(--red); }
  .rule .label { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; position: relative; padding-left: 16px; white-space: nowrap; }
  .rule .label::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; background: var(--red); }
  .rule .body { font-size: 17px; line-height: 1.5; }
  .rule .body strong { font-weight: 700; color: var(--red); }
</style>
</head>
<body>
<div class="slide">

  <div class="bg">
    <img class="marks" src="../backgrounds/05_corner_grids.png" alt="">
  </div>

  <div class="layer">

    <div class="header">
      <div class="title-block">
        <div class="topline">PAPER PLANES · БПМ-11 · оптика управления</div>
        <h1>Две оптики<span class="dot">.</span></h1>
      </div>
    </div>

    <div class="scheme">
      <svg viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ============ ЛЕВО: ОПТИКА ОТДЕЛОВ ============ -->
        <text x="20" y="16" font-family="Unbounded" font-weight="700" font-size="14" fill="#9A958E" letter-spacing="1">ОПТИКА ОТДЕЛОВ</text>
        <rect x="20" y="30" width="640" height="400" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.4" stroke-dasharray="5 4"/>

        <!-- изолированные коробки отделов -->
        <g font-family="Unbounded" font-weight="700" font-size="14" fill="#9A958E" text-anchor="middle">
          <g>
            <rect x="52" y="70" width="180" height="86" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.6"/>
            <text x="142" y="120">ПРОДАЖИ</text>
          </g>
          <g>
            <rect x="252" y="70" width="180" height="86" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.6"/>
            <text x="342" y="120">СКЛАД</text>
          </g>
          <g>
            <rect x="452" y="70" width="180" height="86" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.6"/>
            <text x="542" y="120">ФИНАНСЫ</text>
          </g>
          <g>
            <rect x="52" y="186" width="180" height="86" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.6"/>
            <text x="142" y="236">ПРОИЗВОДСТВО</text>
          </g>
          <g>
            <rect x="252" y="186" width="180" height="86" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.6"/>
            <text x="342" y="236">ЗАКУПКИ</text>
          </g>
          <g>
            <rect x="452" y="186" width="180" height="86" fill="#EFEBE7" stroke="#B8B3AD" stroke-width="1.6"/>
            <text x="542" y="236">IT</text>
          </g>
        </g>
        <text x="340" y="332" font-family="Inter Tight" font-size="16" fill="#6E6963" text-anchor="middle">видно, кто за что отвечает</text>
        <text x="340" y="392" font-family="Inter Tight" font-size="15" fill="#9A958E" text-anchor="middle" font-style="italic">где теряется управляемость — не видно</text>

        <!-- ============ РАЗДЕЛИТЕЛЬ ============ -->
        <line x1="690" y1="30" x2="690" y2="430" stroke="#1A1714" stroke-width="1" stroke-dasharray="4 4"/>

        <!-- ============ ПРАВО: ОПТИКА ПРЕОБРАЗОВАНИЙ ============ -->
        <text x="720" y="16" font-family="Unbounded" font-weight="700" font-size="14" fill="#D62219" letter-spacing="1">ОПТИКА ПРЕОБРАЗОВАНИЙ</text>
        <rect x="720" y="30" width="700" height="400" fill="#EFEBE7" stroke="#1A1714" stroke-width="2"/>

        <!-- цепочка движения объекта: вертикальная змейка из узлов -->
        <g font-family="Unbounded" font-weight="700" font-size="13" fill="#1A1714" text-anchor="middle">
          <!-- ряд 1 -->
          <rect x="752" y="74" width="150" height="64" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
          <text x="827" y="111">КЛИЕНТ</text>
          <rect x="958" y="74" width="150" height="64" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
          <text x="1033" y="111">ЗАКАЗ</text>
          <rect x="1238" y="74" width="150" height="64" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
          <text x="1313" y="111">ПРОИЗ-ВО</text>
          <!-- ряд 2 -->
          <rect x="1238" y="210" width="150" height="64" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
          <text x="1313" y="247">СКЛАД</text>
          <rect x="958" y="210" width="150" height="64" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
          <text x="1033" y="247">ОТГРУЗКА</text>
          <rect x="752" y="210" width="150" height="64" fill="#EFEBE7" stroke="#1A1714" stroke-width="1.6"/>
          <text x="827" y="247">ДЕНЬГИ</text>
        </g>

        <!-- стрелки ряд 1 -->
        <g stroke="#1A1714" stroke-width="2.2" fill="#1A1714">
          <line x1="902" y1="106" x2="950" y2="106"/><polygon points="950,100 962,106 950,112"/>
          <line x1="1108" y1="106" x2="1230" y2="106"/><polygon points="1230,100 1242,106 1230,112"/>
          <!-- вниз -->
          <line x1="1313" y1="138" x2="1313" y2="202"/><polygon points="1307,202 1313,214 1319,202"/>
          <!-- ряд 2 справа налево -->
          <line x1="1238" y1="242" x2="1116" y2="242"/><polygon points="1116,236 1104,242 1116,248"/>
          <line x1="958" y1="242" x2="910" y2="242"/><polygon points="910,236 898,242 910,248"/>
        </g>

        <!-- красные точки потерь на стыках -->
        <g>
          <circle cx="932" cy="106" r="9" fill="#D62219"/><text x="932" y="111" font-family="Unbounded" font-weight="800" font-size="12" fill="#EFEBE7" text-anchor="middle">!</text>
          <circle cx="1313" cy="176" r="9" fill="#D62219"/><text x="1313" y="181" font-family="Unbounded" font-weight="800" font-size="12" fill="#EFEBE7" text-anchor="middle">!</text>
          <circle cx="934" cy="242" r="9" fill="#D62219"/><text x="934" y="247" font-family="Unbounded" font-weight="800" font-size="12" fill="#EFEBE7" text-anchor="middle">!</text>
        </g>

        <text x="1070" y="332" font-family="Inter Tight" font-size="16" fill="#1A1714" text-anchor="middle">видно движение объекта через компанию</text>
        <text x="1070" y="392" font-family="Inter Tight" font-size="15" fill="#D62219" text-anchor="middle">красным — где на стыках теряется смысл</text>

      </svg>
    </div>

    <!-- RULE -->
    <div class="rule">
      <div class="mark">!</div>
      <div class="label">Суть</div>
      <div class="body">
        Отделы показывают зоны ответственности.
        <strong>Управляемость теряется на переходах объекта между функциями, и видит их только оптика преобразований.</strong>
      </div>
    </div>

  </div>

</div>

<script>
  document.fonts.ready.then(() => { document.body.dataset.fontsReady = "1"; });
</script>
</body>
</html>
